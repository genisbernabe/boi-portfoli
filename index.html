<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Boi Vidal Albert — Cinematographer, camera operator & camera assistant. Barcelona, available worldwide.">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<title>Boi Vidal Albert</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: sala de projecció fosca. Cada imatge viu dins d'una pantalla negra amb la seva ràtio real (letterbox).
   Moment fort: intro de càmera (visor → claqueta → diafragma) i cursor-visor sobre les imatges. */
:root{
  --ink:#0e0d0c; --ink-2:#161412; --ink-3:#211e1b;
  --paper:#ebe4d8; --muted:#978e82; --line:rgba(235,228,216,.13);
  --tungsten:#d29c5c; --rec:#e0442f;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --gut-l:max(clamp(16px,4vw,56px),env(safe-area-inset-left,0px));
  --gut-r:max(clamp(16px,4vw,56px),env(safe-area-inset-right,0px));
  --head:60px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html{scroll-behavior:smooth;background:var(--ink);scrollbar-gutter:stable}
body{background:var(--ink);color:var(--paper);font:400 16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--tungsten);outline-offset:3px}
h1,h2,h3{margin:0;font-weight:800;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
.muted{color:var(--muted)}
.wrap{max-width:1440px;margin-inline:auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}

.grain{position:fixed;inset:-80px;z-index:300;pointer-events:none;opacity:.06;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1s steps(4) infinite}
@keyframes grain{0%{transform:translate3d(0,0,0)}25%{transform:translate3d(-40px,28px,0)}50%{transform:translate3d(30px,-40px,0)}75%{transform:translate3d(-28px,-14px,0)}100%{transform:translate3d(0,0,0)}}
@media (pointer:coarse){.grain{animation:none}}
.intro-on .grain{animation:none}

/* ================= CAPÇALERA ================= */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
@media (pointer:coarse){.site-head{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(14,13,12,.96)!important}}
.site-head{position:fixed;inset:0 0 auto;z-index:50;padding-top:env(safe-area-inset-top,0px);
  background:rgba(14,13,12,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.head-in{display:flex;align-items:center;gap:20px;height:var(--head)}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;display:flex;align-items:center;gap:10px;white-space:nowrap;margin-right:auto}
.rec{width:8px;height:8px;border-radius:50%;background:var(--rec);box-shadow:0 0 10px var(--rec);animation:blink 1.6s steps(2) infinite;flex:none}
@keyframes blink{50%{opacity:.25}}
.nav{display:flex;gap:26px}
.nav a{text-decoration:none;color:var(--muted);transition:color .2s}
.nav a:hover,.nav a.cur{color:var(--paper)}
.lang{display:flex;border:1px solid var(--line)}
.lang button{padding:5px 8px;color:var(--muted);font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em}
.lang button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.lang button:hover:not([aria-pressed="true"]){color:var(--paper)}
.menu-btn{display:none}
.head-progress{position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:var(--tungsten);transform-origin:0 50%;transform:scaleX(0)}
@media (max-width:900px){
  .menu-btn{display:block}
  .brand{font-size:1.1rem}
  .nav{position:fixed;inset:calc(var(--head) + env(safe-area-inset-top,0px)) 0 auto 0;flex-direction:column;gap:0;
    background:var(--ink);border-bottom:1px solid var(--line);padding:8px var(--gut-r) 20px var(--gut-l)}
  .nav:not(.open){display:none}
  .nav a{padding:14px 0;border-bottom:1px solid var(--line);font-size:.85rem}
}
@media (max-width:420px){.brand .bn{display:none}}
main>section:not(.hero){content-visibility:auto;contain-intrinsic-size:auto 1000px}
main{padding-top:calc(var(--head) + env(safe-area-inset-top,0px))}
section[id]{scroll-margin-top:calc(var(--head) + 24px)}

/* ================= FOTOGRAMES ================= */
.screen{position:relative;background:#000;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden;max-width:100%}
.frame{position:relative;overflow:hidden;background-color:var(--ink-3);width:100%;max-width:100%}
.frame.tall{width:auto;height:100%}
.frame img,.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.6) 100%);pointer-events:none}
.frame .tag{position:absolute;left:10px;bottom:8px;z-index:1;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;color:rgba(255,255,255,.62)}

/* ================= HERO ================= */
.hero{padding-block:clamp(16px,3vw,32px) 0}
.hero-slot{position:relative;aspect-ratio:2.39/1;max-width:100%}
@media (max-width:700px){.hero-slot{aspect-ratio:4/5}}
.hero-screen{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto}

/* ===== INTRO: el reel arrenca a pantalla completa com un monitor i s'encaixa al seu lloc ===== */
.site-head{transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.reel-tabs,.hero-meta,main>section:not(.hero),footer{transition:opacity .9s ease .2s}
.intro-on .site-head{transform:translateY(-110%)}
.intro-on .reel-tabs,.intro-on .hero-meta,.intro-on main>section:not(.hero),.intro-on footer{opacity:0}
.intro-on .hero-name .w span{transform:translateY(105%)}
/* l'animació del monitor és un FLIP: només transform (GPU), sense recalcular mides cada fotograma */
/* el monitor ampliat no pot eixamplar la pàgina (al mòbil desplaçava tot cap a la dreta) */
html,body{overflow-x:clip}
.hero{overflow-x:clip}
.intro-on .hero-screen{z-index:120;transform-origin:0 0}
.hero-screen.landing{transition:transform 1s cubic-bezier(.75,0,.2,1)}
.hud,.hero-screen::before,.hero-screen::after{transition:opacity .5s ease}
.intro-on .hud{opacity:0}
.intro-on .hero-screen::before,.intro-on .hero-screen::after{opacity:0}
/* desenfocament barat: una còpia petita (1/4) desenfocada i ampliada, que s'esvaeix amb opacity */
.blur-layer{position:absolute;left:-3%;top:-3%;width:26.5%;height:26.5%;transform-origin:0 0;transform:scale(4);filter:blur(4px) brightness(.5) saturate(.85);z-index:1;pointer-events:none;transition:opacity .55s ease;will-change:opacity}
.blur-layer .frame{position:absolute;inset:0;height:100%}
.blur-layer .frame::after{display:none}
.t-out .blur-layer{opacity:0}
/* vídeo de portada (La primera noche): nítid i en loop; durant la intro el tapa la capa desenfocada */
.hero-video{position:absolute;inset:-3%;width:106%;height:106%;object-fit:cover;object-position:55% 50%;pointer-events:none;background:#000}
.blur-layer video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:55% 50%}
.has-video .reel-tabs{display:none}

/* títol de la intro: capa fixa a sobre, fora del monitor (no s'escala) */
.intro-stage{position:fixed;inset:0;z-index:125;display:none;place-items:center;pointer-events:none;text-align:center;padding:0 6vw;contain:layout paint}
.intro-on .intro-stage{display:grid}
.intro-on.settle .intro-stage{display:none}
.it-wrap{display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2vw,24px)}
.it-name{position:relative;font-family:var(--f-display);font-weight:800;text-transform:uppercase;line-height:.84;font-size:clamp(3.4rem,13vw,12.5rem);color:#f3eee6;letter-spacing:-.005em}
.it-name .ln{display:block;white-space:nowrap}
.it-tag{color:rgba(255,255,255,.82);letter-spacing:.18em}
.it-wrap{opacity:0;transition:opacity .9s ease}
.t-in .it-wrap,.t-out .it-wrap{opacity:1}
/* el nom es tanca: cada lletra es desplaça amb transform (abans s'animava letter-spacing, que recalcula el text a cada fotograma) */
.it-name .ch{display:inline-block;white-space:pre;transform:translate3d(calc(var(--o) * .24em),0,0);transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
.t-in .it-name .ch,.t-out .it-name .ch{transform:none}
.half{display:block;transition:transform .7s cubic-bezier(.75,0,.25,1)}
.t-in .half,.t-out .half{will-change:transform}
.half.top{clip-path:inset(0 0 50% 0)}
.half.bot{position:absolute;inset:0;clip-path:inset(50% 0 0 0)}
.t-out .half.top{transform:translate3d(0,-85vh,0)}
.t-out .half.bot{transform:translate3d(0,85vh,0)}
.t-out .it-tag{opacity:0;transition:opacity .15s}
.shutter-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.t-out .shutter-flash{animation:sflash .35s ease-out}
@keyframes sflash{0%{opacity:.45}100%{opacity:0}}
.intro-black{position:fixed;inset:0;z-index:124;background:#000;opacity:0;pointer-events:none;transition:opacity .5s ease}
.intro-wait .intro-black{opacity:1;transition:none}
.skip{position:fixed;z-index:130;left:50%;transform:translateX(-50%);top:max(18px,calc(env(safe-area-inset-top,0px) + 14px));padding:8px 12px;border:1px solid rgba(255,255,255,.35);color:#fff;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .3s}
.intro-on:not(.settle) .skip{opacity:1;pointer-events:auto}
.skip:hover{background:#fff;color:#000}
#slides{position:absolute;inset:0;transition:transform .6s ease-out}
.slide{position:absolute;inset:-3%;opacity:0;transition:opacity 1.3s ease}
.slide.on{opacity:1}
.slide .frame{position:absolute;inset:0;height:100%;transform:scale(1.06);transition:transform 6s ease-out}
.slide.on .frame{transform:scale(1)}
.hud{position:absolute;inset:0;z-index:2;pointer-events:none;padding:clamp(14px,2vw,26px);display:flex;flex-direction:column;justify-content:space-between}
.hud-row{display:flex;justify-content:space-between;align-items:center;gap:12px;color:rgba(255,255,255,.85);text-shadow:0 1px 8px rgba(0,0,0,.6)}
.hud-row .mono{display:flex;align-items:center;gap:8px}
.tc{font-variant-numeric:tabular-nums}
.corners::before,.corners::after{content:"";position:absolute;width:28px;height:28px;border-color:rgba(255,255,255,.55);border-style:solid;z-index:2;pointer-events:none}
.corners::before{top:12px;left:12px;border-width:1px 0 0 1px}
.corners::after{bottom:12px;right:12px;border-width:0 1px 1px 0}
.reel-tabs{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:12px;margin-top:12px}
.reel-tabs button{text-align:left;padding-top:10px;color:var(--muted);transition:color .2s;min-width:0}
.reel-tabs button:hover,.reel-tabs button.on{color:var(--paper)}
.reel-tabs .bar{display:block;height:2px;background:var(--line);margin-bottom:8px;overflow:hidden}
.reel-tabs .bar i{display:block;height:100%;width:0;background:var(--paper)}
.reel-tabs button.on .bar i{animation:fill var(--dur,4.6s) linear forwards}
.reel-tabs button.done .bar i{width:100%}
.reel-tabs .tt{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes fill{to{width:100%}}
@media (max-width:600px){.reel-tabs .tn{display:none}}
.hero-id{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 40px;padding-block:clamp(28px,4vw,52px) clamp(20px,3vw,32px);border-bottom:1px solid var(--line)}
.hero-name{font-family:var(--f-display);font-weight:800;text-transform:uppercase;line-height:.85;letter-spacing:-.005em;font-size:clamp(3rem,9.6vw,8.8rem);min-width:0}
.hero-name .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.04em}
.hero-name .w span{display:inline-block}
.go .hero-name .w span{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.go .hero-name .w:nth-child(2) span{animation-delay:.08s}.go .hero-name .w:nth-child(3) span{animation-delay:.16s}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
.hero-meta{display:flex;flex-direction:column;gap:6px;text-align:right;color:var(--muted)}
.hero-meta strong{color:var(--paper);font-weight:500}
@media (max-width:700px){.hero-meta{text-align:left}}

/* intro */
.intro{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:clamp(24px,5vw,80px);align-items:end;padding-block:clamp(48px,7vw,96px)}
.intro .portrait{aspect-ratio:4/5}
.intro .portrait .frame{height:100%}
.lede{font-size:clamp(1.3rem,2.4vw,2rem);line-height:1.3;max-width:30ch;font-weight:500;text-wrap:balance}
.lede em{font-style:normal;color:var(--tungsten)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border:1px solid var(--line);text-decoration:none;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;transition:background .2s,border-color .2s,color .2s}
.btn:hover{border-color:var(--paper)}
.btn.solid{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.btn.solid:hover{background:var(--tungsten);border-color:var(--tungsten)}
@media (max-width:700px){.intro{grid-template-columns:1fr}.intro .portrait{max-width:260px}}

.sec{padding-block:clamp(56px,8vw,112px);border-top:1px solid var(--line)}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px 24px;margin-bottom:32px}
.sec-head h2{font-family:var(--f-display);font-size:clamp(2.6rem,7vw,5.5rem);text-transform:uppercase;line-height:.9}
.sec-head h2 sup{font-family:var(--f-mono);font-size:.8rem;font-weight:400;color:var(--muted);vertical-align:top;margin-left:6px;letter-spacing:.05em}

.filters{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.frow .label{width:64px;color:var(--muted)}
.chip{padding:7px 12px;border:1px solid var(--line);font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);transition:all .2s}
.chip:hover{color:var(--paper);border-color:rgba(235,228,216,.4)}
.chip[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.toolbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.views{display:flex;gap:4px}

/* treballs: tira de pel·lícula */
.hint{margin:0 0 24px}
.empty{padding:48px 0;color:var(--muted)}
.strip-bleed{margin-inline:calc(50% - 50vw)}
.strip{position:relative;overflow:hidden;background:#0b0907;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.strip:focus-visible{outline-offset:-3px}
.strip.drag{cursor:grabbing}
.strip-track{display:flex;will-change:transform}
.sf{--perf:rgba(242,234,218,.85);--k:1;--b:1;flex:none;width:max(300px,min(58vw,calc((100vh - 290px) * 1.7778),1000px));padding:52px 12px 84px;background:#0b0907;position:relative;border-right:1px solid #000}
@media (max-width:700px){.sf{width:86vw;padding:44px 8px 76px}.sf-edge .yr{display:none}}
.sf::before,.sf::after{content:"";position:absolute;left:0;right:0;height:14px;background:repeating-linear-gradient(90deg,transparent 0 10px,var(--perf) 10px 25px,transparent 25px 35px)}
.sf::before{top:12px}.sf::after{bottom:12px}
.sf-edge{position:absolute;left:16px;right:16px;top:31px;display:flex;justify-content:space-between;gap:12px;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.22em;color:#d9893a;white-space:nowrap}
.sf-edge .live{display:none;color:#fff;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.sf.center .sf-edge .live{display:inline-flex}
.sf .screen{transform:scale(var(--k));filter:brightness(var(--b)) saturate(calc(.55 + var(--b) * .45))}
.stack{position:relative;width:100%;max-width:100%}
.stack.tall{width:auto;height:100%}
.stack .frame{position:absolute;inset:0;height:100%;opacity:0;transition:opacity .5s ease}
.stack .frame.on{opacity:1}
.sf-cap{position:absolute;left:16px;right:16px;bottom:34px;display:flex;justify-content:space-between;align-items:baseline;gap:16px;min-width:0;opacity:calc(.35 + var(--b) * .65)}
.sf-cap b{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,3vw,2.6rem);text-transform:uppercase;line-height:1;white-space:nowrap;transition:color .2s}
.sf-cap .mono{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sf:hover .sf-cap b{color:var(--tungsten)}
.strip-ctl{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:18px;flex-wrap:wrap}
.strip-ctl .mono{font-variant-numeric:tabular-nums}
.ctl-btns{display:flex;gap:8px}
.ctl-btns .btn{padding:10px 16px}


/* ===== PROPOSTES FOTOGRAFIES (selector temporal) ===== */
.ph-views{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:-8px 0 14px}
.vsep{color:var(--tungsten);padding:0 6px 0 14px}
.chip.prop{border-color:rgba(210,156,92,.35)}
.ph-hint{margin:0 0 24px}
.ph .frame,.cam-ph .frame{position:absolute;inset:0;height:100%}
.ph{display:block;position:relative;width:100%;overflow:hidden}

/* 1 · Revelat: cordill d'assecat sota llum de seguretat */
.dark{position:relative;padding:22px clamp(16px,3vw,44px) 30px;overflow:hidden;
  background:radial-gradient(ellipse 70% 55% at 50% 0%,rgba(196,30,18,.38),rgba(196,30,18,0) 70%),#0d0606;transition:background .8s}
.dark::after{content:"";position:absolute;inset:0;background:rgba(255,46,24,.2);mix-blend-mode:multiply;pointer-events:none;transition:opacity .8s}
.dark.white{background:radial-gradient(ellipse 70% 55% at 50% 0%,rgba(255,240,214,.14),rgba(255,240,214,0) 70%),#161310}
.dark.white::after{opacity:0}
.dark-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;color:rgba(255,220,210,.75);flex-wrap:wrap}
.safelight{display:flex;align-items:center;gap:10px}
.safelight i{width:10px;height:10px;border-radius:50%;background:#e2301f;box-shadow:0 0 16px 5px rgba(226,48,31,.55);transition:all .6s}
.dark.white .safelight i{background:#f3e9d6;box-shadow:0 0 16px 5px rgba(243,233,214,.45)}
.dark-top .btn{color:rgba(255,230,220,.9);border-color:rgba(255,200,190,.25)}
.line{position:relative;margin-bottom:34px}
.wire{position:absolute;left:-6%;width:112%;top:0;height:40px;overflow:visible;pointer-events:none}
.wire path{fill:none;stroke:#7a675b;stroke-width:1.3;vector-effect:non-scaling-stroke}
.line-prints{position:relative;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:0 clamp(14px,2.4vw,34px)}
.print{display:block;width:100%;text-align:left;padding-top:var(--y);transform-origin:50% var(--y);animation:sway var(--sway) ease-in-out var(--d) infinite alternate}
@keyframes sway{from{transform:rotate(-1.3deg)}to{transform:rotate(1.3deg)}}
.print:hover{animation-play-state:paused}
.pin{display:block;width:11px;height:28px;margin:-12px auto -14px;position:relative;z-index:2;border-radius:2px;background:linear-gradient(90deg,#a87b4d,#c99a66 45%,#8a6036);box-shadow:0 3px 5px rgba(0,0,0,.55)}
.pin::after{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:1px;background:rgba(0,0,0,.35)}
.paper{display:block;background:#efe9de;padding:8px 8px 10px;box-shadow:0 16px 34px rgba(0,0,0,.6);transition:transform .3s}
.print:hover .paper{transform:translateY(-3px)}
.paper .frame{filter:brightness(1.85) contrast(.38) sepia(.55) saturate(.3);transition:filter 3.4s cubic-bezier(.3,0,.2,1) var(--d2,0s)}
.print.dev .paper .frame{filter:none}
.print:hover .paper .frame{filter:none;transition-duration:1.1s;transition-delay:0s}
.pcap{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:8px;color:#3a332c;font-size:.82rem;line-height:1.25}
.pcap .mono{font-size:.56rem;color:#7a6f63;white-space:nowrap}

/* 2 · Taula de còpies */
.ptable{position:relative;overflow:hidden;border:1px solid var(--line);background:radial-gradient(ellipse at 50% 35%,#2b2621,#141210 80%);touch-action:pan-y}
.ptable::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background:repeating-linear-gradient(115deg,rgba(255,255,255,.012) 0 2px,transparent 2px 9px)}
.pr{position:absolute;transform:rotate(var(--r));transition:transform .25s ease;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.pr-in{display:block;background:#f2ede3;padding:9px 9px 12px;box-shadow:0 10px 26px rgba(0,0,0,.55);transition:box-shadow .25s}
.pr.analog .pr-in{background:#0b0a09;padding:14px 11px 30px;position:relative}
.pr.analog .pr-in::after{content:attr(data-edge);position:absolute;left:12px;right:12px;bottom:10px;font-family:var(--f-mono);font-size:.54rem;letter-spacing:.2em;color:#d98a3a;white-space:nowrap;overflow:hidden}
.pr-cap{display:flex;justify-content:space-between;gap:8px;margin-top:7px;color:#3a332c;font-size:.78rem;line-height:1.2}
.pr.analog .pr-cap{display:none}
.pr:hover{transform:rotate(calc(var(--r) * .6)) translateY(-3px)}
.pr.lift{transform:rotate(calc(var(--r) * .3)) scale(1.05);cursor:grabbing;transition:transform .15s ease}
.pr.lift .pr-in{box-shadow:0 34px 70px rgba(0,0,0,.65)}

/* 3 · Obturador */
.cam{position:relative;aspect-ratio:3/2;max-height:max(340px,calc(100vh - 230px));width:100%;background:#000;overflow:hidden;cursor:pointer;max-width:100%}
@media (max-width:700px){.cam{aspect-ratio:4/5}}
.cam-img{position:absolute;inset:0;display:grid;place-items:center}
.cam-ph{position:relative;max-width:100%}
.cam-ov{position:absolute;inset:0;pointer-events:none;z-index:2}
.af{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(3,18px);gap:clamp(30px,7vw,90px) clamp(40px,9vw,120px)}
.af i{width:18px;height:14px;border:1px solid rgba(255,255,255,.45)}
.af i.c{border-color:#fff}
.cam.focus .af i.c{border-color:#ff3b2b;box-shadow:0 0 8px rgba(255,59,43,.7)}
.lcd{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:clamp(14px,3vw,38px);align-items:center;padding:10px 12px;background:rgba(0,0,0,.72);color:#a6e2a0;font-family:var(--f-mono);font-size:clamp(.66rem,1.3vw,.86rem);letter-spacing:.12em;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.meter{display:inline-flex;align-items:center;gap:3px}
.meter i{width:2px;height:7px;background:#a6e2a0;opacity:.5}
.meter i.z{height:11px;opacity:1}
.cam-bar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:16px 28px;margin-top:18px}
.cam-title b{display:block;font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,3.4vw,2.6rem);text-transform:uppercase;line-height:1}
.dial{display:flex;gap:2px;padding:6px 8px;background:#0b0a09;border:1px solid var(--line);overflow-x:auto;max-width:min(52vw,520px)}
.dial button{min-width:30px;padding:4px 0;font-family:var(--f-mono);font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.dial button:hover{color:var(--paper)}
.dial button.on{color:#ff8a3d}
.shutter{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#d9d3c9,#8f887d 70%);box-shadow:0 0 0 4px #1f1c19,0 0 0 5px #4a453e,0 6px 18px rgba(0,0,0,.5);transition:transform .1s}
.shutter:active,.shutter.press{transform:scale(.9)}
@media (max-width:700px){.cam-bar{grid-template-columns:1fr auto}.dial{grid-column:1/-1;order:3;max-width:100%}}

/* fotografies */
.photos{columns:3 280px;column-gap:20px}
.photo{break-inside:avoid;margin:0 0 20px}
.photo button{display:block;width:100%;text-align:left}
.photo .pf{transition:transform .4s}
.photo button:hover .pf{transform:scale(.985)}
.photo.analog .pf{background:#050505;padding:14px 10px 30px;position:relative}
.photo.analog .pf::after{content:attr(data-edge);position:absolute;left:12px;bottom:9px;font-family:var(--f-mono);font-size:.58rem;letter-spacing:.2em;color:#d98a3a;white-space:nowrap;overflow:hidden;right:12px}
.photo figcaption{display:flex;justify-content:space-between;gap:12px;margin-top:8px}

/* BTS */
.bts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:20px}
.bts figure{margin:0}
.bts .frame{aspect-ratio:4/5;filter:grayscale(1) contrast(1.15) brightness(.9);transition:filter .6s ease}
.bts figure:nth-child(3n+2) .frame{aspect-ratio:3/2}
.bts figure:hover .frame{filter:none}
@media (hover:none){.bts .frame{filter:none}}
.bts figcaption{margin-top:8px;font-size:.88rem;color:var(--muted)}
.bts figcaption b{color:var(--paper);font-weight:600}

/* sobre mi */
.about{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,5vw,80px)}
.about .portrait .frame{aspect-ratio:3/4}
.about-body{display:flex;flex-direction:column;gap:44px;min-width:0}
.about-body .lede{max-width:34ch}
.block h3{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tungsten);font-weight:500;margin-bottom:14px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.roles button{background:var(--ink);padding:18px;text-align:left;transition:background .2s}
.roles button:hover{background:var(--ink-2)}
.roles b{display:block;font-family:var(--f-display);font-size:1.5rem;text-transform:uppercase;font-weight:800;line-height:1.1}
.roles span{display:block;font-size:.92rem;color:var(--muted)}
.roles em{display:block;margin-top:10px;font-style:normal;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tungsten)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:10px 28px;margin:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.cv{width:100%;border-collapse:collapse;font-size:.95rem}
.cv td{padding:10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.cv td:first-child{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);width:70px;padding-top:13px}
.cv td:last-child{text-align:right;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;color:var(--tungsten);padding-top:13px}
.cv button{text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.cv button:hover{text-decoration-color:var(--tungsten)}
@media (max-width:820px){.about{grid-template-columns:1fr}.about .portrait{max-width:360px}}

/* contacte */
.contact-mail{display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;margin-block:12px 40px}
.contact-mail a{font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,6.4vw,5.4rem);text-transform:uppercase;line-height:1;text-decoration:none;overflow-wrap:anywhere;user-select:all}
.contact-mail a:hover{color:var(--tungsten)}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));border-top:1px solid var(--line)}
.links a{display:flex;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--line);text-decoration:none;margin-right:24px;transition:color .2s,padding .2s}
.links a:hover{color:var(--tungsten);padding-left:8px}
footer{padding-block:28px;border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;color:var(--muted)}
footer button:hover{color:var(--paper)}

/* fitxa de projecte */
.sheet{position:fixed;inset:0;z-index:100;background:var(--ink);overflow-y:auto;overscroll-behavior:contain;animation:sheetIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetIn{from{clip-path:inset(50% 0 50% 0)}to{clip-path:inset(0 0 0 0)}}
.sheet-bar{position:sticky;top:0;z-index:5;background:rgba(14,13,12,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sheet-bar .wrap{display:flex;justify-content:space-between;align-items:center;height:var(--head);gap:16px}
.sheet-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 32px;padding-block:28px 20px}
.sheet-title{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:clamp(3rem,10vw,8.5rem);line-height:.85}
.sheet-hero .screen{aspect-ratio:2.39/1}
@media (max-width:700px){.sheet-hero .screen{aspect-ratio:16/10}}
.sheet-hero .frame{position:absolute;inset:0;height:100%}
.sheet-info{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(28px,5vw,72px);padding-block:36px 64px}
.sheet-info .lede{max-width:28ch}
.spec{display:grid;grid-template-columns:auto 1fr;margin:0;border-top:1px solid var(--line)}
.spec dt,.spec dd{padding:11px 0;border-bottom:1px solid var(--line);margin:0}
.spec dt{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-right:24px;padding-top:14px}
.spec dd{text-align:right}
.reel{margin-top:32px}
.reel .frame{position:absolute;inset:0;height:100%;filter:brightness(.55)}
.play{position:absolute;z-index:3;display:flex;align-items:center;gap:14px;text-decoration:none}
.play i{width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.7);display:grid;place-items:center;transition:background .2s,transform .2s}
.play i::before{content:"";border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.play:hover i{background:var(--rec);border-color:var(--rec);transform:scale(1.08)}
.sub-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:20px;border-top:1px solid var(--line);margin-top:24px}
.sub-head h3{font-family:var(--f-display);font-size:clamp(1.8rem,4vw,3rem);text-transform:uppercase}
.stills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.stills figure{margin:0}
.stills figure:first-child,.stills figure:last-child:nth-child(even){grid-column:1/-1}
.stills button{display:block;width:100%}
.stills figcaption{margin-top:6px}
@media (max-width:700px){.stills{grid-template-columns:1fr}.sheet-info{grid-template-columns:1fr}}
.mk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.mk .frame{aspect-ratio:4/5;filter:grayscale(1) contrast(1.15);transition:filter .5s}
.mk figure{margin:0}
.mk figure:hover .frame{filter:none}
@media (max-width:820px){.mk{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (hover:none){.mk .frame{filter:none}}
.next{display:block;width:100%;text-align:left;margin-top:64px;padding-block:40px 64px;border-top:1px solid var(--line)}
.next b{display:block;font-family:var(--f-display);font-size:clamp(2.4rem,8vw,6rem);text-transform:uppercase;line-height:.9;transition:color .2s,transform .3s}
.next:hover b{color:var(--tungsten);transform:translateX(12px)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:150;background:rgba(6,6,5,.96);display:grid;place-items:center;padding:max(60px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(60px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb figure{margin:0;max-width:100%}
.lb figcaption{display:flex;justify-content:space-between;gap:16px;margin-top:10px}
.lb-btn{position:absolute;padding:10px 14px;border:1px solid var(--line);font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase}
.lb-btn:hover{background:var(--paper);color:var(--ink)}
.lb-close{top:max(14px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
.lb-prev{left:max(16px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px))}
.lb-next{right:max(16px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px))}

/* cursor-visor */
.reticle{position:fixed;left:0;top:0;z-index:180;width:76px;height:50px;margin:-25px 0 0 -38px;pointer-events:none;opacity:0;transition:opacity .2s, width .25s, height .25s, margin .25s}
.reticle.on{opacity:1}
.reticle.big{width:96px;height:64px;margin:-32px 0 0 -48px}
.reticle i{position:absolute;width:12px;height:12px;border:0 solid #fff}
.reticle .a{top:0;left:0;border-width:1.5px 0 0 1.5px}.reticle .b{top:0;right:0;border-width:1.5px 1.5px 0 0}
.reticle .c{bottom:0;left:0;border-width:0 0 1.5px 1.5px}.reticle .d{bottom:0;right:0;border-width:0 1.5px 1.5px 0}
.reticle::before,.reticle::after{content:"";position:absolute;left:50%;top:50%;background:#fff}
.reticle::before{width:1px;height:10px;transform:translate(-50%,-50%)}
.reticle::after{width:10px;height:1px;transform:translate(-50%,-50%)}
.reticle span{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:#fff;display:flex;align-items:center;gap:6px;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.reticle span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--rec)}
@media (hover:hover) and (pointer:fine){[data-cursor]{cursor:none}}
@media not ((hover:hover) and (pointer:fine)){.reticle{display:none}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>

      </div>

        <div class="cam corners" id="cam" role="button" tabindex="0" data-cursor="zoom">
          <div class="cam-img" id="camImg"></div>

            <div class="lcd" id="lcd"></div></div>

          <div class="cam-title"><b id="camTitle"></b><span class="mono muted" id="camMeta"></span></div>

          <button class="shutter" id="shutterBtn" aria-label="Disparar: foto següent"></button>

  <section class="sec" id="bts">
    <div class="wrap">

      <div class="bts" id="btsGrid"></div>

  <section class="sec" id="sobre">
    <div class="wrap">
      <div class="sec-head"><h2 data-i18n="about.title"></h2></div>
      <div class="about">
        <div class="portrait"><div class="frame" id="aboutPortrait"><span class="tag" data-i18n="tag.set"></span></div></div>

  const r=rng(seed); const [sh,md,hl,ac]=pal; const n=v=>v.toFixed(0);
  const layers=[
    `radial-gradient(ellipse ${n(18+r()*22)}% ${n(22+r()*30)}% at ${n(12+r()*76)}% ${n(15+r()*50)}%, ${hl} 0%, ${hl}00 70%)`,
    `radial-gradient(circle at ${n(r()*100)}% ${n(r()*100)}%, ${ac}cc 0%, ${ac}00 32%)`];
  if(r()>.35){const x=+n(r()*80), w=+n(6+r()*16);
    layers.push(`linear-gradient(90deg, transparent ${x}%, ${sh}e6 ${x}%, ${sh}e6 ${x+w}%, transparent ${x+w}%)`);}
  if(r()>.5){const y=n(55+r()*30); layers.push(`linear-gradient(180deg, transparent ${y}%, ${sh}d9 ${y}%)`);}
  layers.push(`radial-gradient(ellipse ${n(50+r()*40)}% ${n(50+r()*40)}% at ${n(r()*100)}% ${n(40+r()*60)}%, ${md} 0%, ${md}00 75%)`);

}

function renderStrip(){
  ST.n=viewItems.length; const one=viewItems.map(sfHTML).join("");
  stripTrack.innerHTML=one;
  ST.step=stripTrack.firstElementChild.getBoundingClientRect().width||600;
  ST.loopW=ST.step*ST.n;
  const reps=Math.max(3,Math.ceil(stripEl.clientWidth*2/ST.loopW)+2);
  stripTrack.innerHTML=Array(reps).fill(one).join("");
  ST.x=centerX()-ST.loopW; ST.vel=0; ST.target=null; ST.center=null; ST.centerI=-1;
  paintStrip(); kickStrip();
}
function paintStrip(){
  if(ST.loopW){
    while(ST.x<=-2*ST.loopW){ST.x+=ST.loopW; if(ST.target!==null)ST.target+=ST.loopW}
    while(ST.x>-ST.loopW+ST.step){ST.x-=ST.loopW; if(ST.target!==null)ST.target-=ST.loopW}
  }
  stripTrack.style.transform=`translate3d(${ST.x.toFixed(2)}px,0,0)`;
  const mid=stripEl.clientWidth/2, kids=stripTrack.children; let best=null, bd=1e9, bi=0;
  for(let j=0;j<kids.length;j++){
    const c=ST.x+j*ST.step+ST.step/2; const d=Math.abs(c-mid)/ST.step;
    if(d>2.2) continue;
    const dd=Math.min(d,1.2);
    kids[j].style.setProperty("--k",(1-dd*.07).toFixed(3));
    kids[j].style.setProperty("--b",(1-Math.min(d,1)*.55).toFixed(3));
    if(d<bd){bd=d;best=kids[j];bi=j}
  }
  if(best!==ST.center){
    if(ST.center){ ST.center.classList.remove("center"); ST.center.querySelectorAll(".stack .frame").forEach((f,k)=>f.classList.toggle("on",k===0)); }
    ST.center=best; if(best) best.classList.add("center");
    const i=bi%ST.n; ST.centerI=i;
    stripCount.textContent=`FRAME ${pad(i+1)} / ${pad(ST.n)} · ${viewItems[i].title}`;
  }
}
function stripTick(){
  ST.raf=0;

    else { ST.x+=ST.vel; ST.vel*=.93; if(Math.abs(ST.vel)<.05) ST.vel=0; if(!reduce&&!ST.hover&&!ST.vel) ST.x-=.35; }

}
function kickStrip(){ if(!ST.raf) ST.raf=requestAnimationFrame(stripTick) }
function snapTo(delta){ ST.vel=0; const j=Math.round((centerX()-ST.x)/ST.step)+delta; ST.target=centerX()-j*ST.step; kickStrip(); }
new IntersectionObserver(es=>{ST.visible=es[0].isIntersecting;
  if(ST.visible&&viewItems.length){ const w=stripTrack.firstElementChild&&stripTrack.firstElementChild.getBoundingClientRect().width; if(w&&Math.abs(w-ST.step)>1) renderStrip(); }
  if(ST.visible) kickStrip()}).observe(stripEl);

    const rot=((r()-.5)*16).toFixed(1);
    return `<div class="pr ${f.kind}" data-ph="${i}" data-cursor="zoom" style="left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;width:${pw.toFixed(0)}px;--r:${rot}deg;z-index:${i+1}">
      <span class="pr-in" data-edge="${f.kind==="analog"?"▸ "+(12+i)+"A  "+f.meta.toUpperCase():""}"><span class="ph" style="aspect-ratio:${f.ar}">${frame(f.pal,phSeed(f),{img:f.img})}</span>
      <span class="pr-cap"><span>${esc(L(f.title))}</span><span class="mono muted">${esc(f.meta)}</span></span></span></div>`}).join("");
  document.getElementById("tableCount").textContent=`${pad(n)} ${n===1?"còpia":"còpies"}`;
}
let drag=null;
ptable.addEventListener("pointerdown",e=>{
  const p=e.target.closest(".pr"); if(!p||e.button!==0) return;
  e.preventDefault();
  drag={p,sx:e.clientX,sy:e.clientY,l:p.offsetLeft,t:p.offsetTop,moved:0};
  p.style.zIndex=++tableZ; p.classList.add("lift"); try{p.setPointerCapture(e.pointerId)}catch(_){}
});
ptable.addEventListener("pointermove",e=>{
  if(!drag) return; const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy; drag.moved=Math.max(drag.moved,Math.abs(dx)+Math.abs(dy));
  const W=ptable.clientWidth, H=ptable.clientHeight, p=drag.p;
  p.style.left=Math.max(-p.offsetWidth*.3,Math.min(W-p.offsetWidth*.7,drag.l+dx))+"px";
  p.style.top=Math.max(-p.offsetHeight*.3,Math.min(H-p.offsetHeight*.6,drag.t+dy))+"px";
});
const tableUp=()=>{ if(!drag) return; const d=drag; drag=null; d.p.classList.remove("lift"); if(d.moved<6) openLb(phItems(),+d.p.dataset.ph); };
ptable.addEventListener("pointerup",tableUp); ptable.addEventListener("pointercancel",()=>{ if(drag){drag.p.classList.remove("lift");drag=null} });
document.getElementById("tableShuffle").addEventListener("click",()=>{ tableSeed++; renderTable(); });

/* --- 3 · Obturador --- */
const camEl=document.getElementById("cam"), camImg=document.getElementById("camImg"), dialEl=document.getElementById("dial");
const CAM={i:0,busy:false};
/* diafragma hexagonal regular, calculat en píxels perquè no es deformi */
function hexPoly(R,rot,W,H){ const pts=[]; for(let k=0;k<6;k++){ const a=(rot+k*60)*Math.PI/180; pts.push(`${(W/2+R*Math.cos(a)).toFixed(1)}px ${(H/2+R*Math.sin(a)).toFixed(1)}px`); } return `polygon(${pts.join(",")})`; }
function renderCam(){
  dialEl.innerHTML=shownPhotos.map((f,i)=>`<button data-cf="${i}" aria-label="${esc(L(f.title))}">${i+1}</button>`).join("");
  CAM.i=0; CAM.busy=false; showCam(true);
}
function fitCam(){
  const f=shownPhotos[CAM.i]; const ph=camImg.firstElementChild; if(!f||!ph) return;
  const w=Math.min(camEl.clientWidth, camEl.clientHeight*f.ar); ph.style.width=w.toFixed(0)+"px";
}
function showCam(){
  const f=shownPhotos[CAM.i]; if(!f) return; const x=exif(f);
  camImg.innerHTML=`<div class="cam-ph" style="aspect-ratio:${f.ar}">${frame(f.pal,phSeed(f),{img:f.img})}</div>`; fitCam();
  const meter=Array.from({length:9},(_,k)=>`<i class="${k===4+x.ev?"z":""}"></i>`).join("");
  document.getElementById("lcd").innerHTML=`<span>${x.sp}</span><span>${x.fs}</span><span>ISO ${x.iso}</span><span>${x.mm} mm</span><span class="meter">−${meter}+</span><span>[${String(shownPhotos.length-CAM.i).padStart(2,"0")}]</span>`;
  document.getElementById("camTitle").textContent=L(f.title);
  document.getElementById("camMeta").textContent=f.meta;
  dialEl.querySelectorAll("[data-cf]").forEach((b,k)=>b.classList.toggle("on",k===CAM.i));
  const on=dialEl.querySelector(".on"); if(on) on.scrollIntoView({block:"nearest",inline:"center"});
  camEl.setAttribute("aria-label",`Ampliar ${L(f.title)}`);
  camEl.classList.remove("focus"); setTimeout(()=>camEl.classList.add("focus"),120); setTimeout(()=>camEl.classList.remove("focus"),900);
}
function fire(i){
  const n=shownPhotos.length; if(!n||CAM.busy) return; i=((i%n)+n)%n;
  const b=document.getElementById("shutterBtn"); b.classList.add("press"); setTimeout(()=>b.classList.remove("press"),140);
  if(reduce||!camImg.animate){ CAM.i=i; showCam(); return; }
  CAM.busy=true;
  const W=camImg.clientWidth, H=camImg.clientHeight, R=Math.hypot(W,H)/2/0.866+8;
  const IRIS_OPEN=hexPoly(R,0,W,H), IRIS_SHUT=hexPoly(0,55,W,H);
  const a=camImg.animate([{clipPath:IRIS_OPEN},{clipPath:IRIS_SHUT}],{duration:170,easing:"cubic-bezier(.6,0,1,1)",fill:"forwards"});
  a.onfinish=()=>{ CAM.i=i; showCam();
    const o=camImg.animate([{clipPath:IRIS_SHUT},{clipPath:IRIS_OPEN}],{duration:280,delay:60,easing:"cubic-bezier(0,0,.25,1)",fill:"forwards"});
    o.onfinish=()=>{ CAM.busy=false; o.cancel(); a.cancel(); }; };
}
document.getElementById("shutterBtn").addEventListener("click",()=>fire(CAM.i+1));
dialEl.addEventListener("click",e=>{const b=e.target.closest("[data-cf]"); if(b&&+b.dataset.cf!==CAM.i) fire(+b.dataset.cf)});
camEl.addEventListener("click",()=>openLb(phItems(),CAM.i));
camEl.addEventListener("keydown",e=>{ if(e.key==="ArrowRight"){e.preventDefault();fire(CAM.i+1)} if(e.key==="ArrowLeft"){e.preventDefault();fire(CAM.i-1)} if(e.key==="Enter"||e.key===" "){e.preventDefault();camEl.click()} });

let phRsz=null;
addEventListener("resize",()=>{ clearTimeout(phRsz); phRsz=setTimeout(()=>{ if(photoView==="dark") renderDark(); if(photoView==="table") renderTable(); if(photoView==="shutter") fitCam(); },200); });

/* ============ BTS ============ */
function renderBts(){

    <figure data-cursor="color">${frame(p.pal,hash(b.p+"bts"+i),{img:b.img})}
    <figcaption><b>${esc(p.title)}</b> · ${esc(L(b.c))}</figcaption></figure>`}).join("");

/* ============ SOBRE MI ============ */
function renderAbout(){
  document.getElementById("rolesGrid").innerHTML=["DOP","Operador","1AC","2AC"].map(r=>{
    const n=PROJECTS.filter(p=>p.roles.includes(r)).length;

/* ============ FITXA DE PROJECTE ============ */
const sheet=document.getElementById("sheet"); let lastFocus=null, currentId=null;
function openProject(id){
  const p=byId(id); if(!p) return; currentId=id;
  const i=PROJECTS.indexOf(p), next=PROJECTS[(i+1)%PROJECTS.length];
  const stills=Array.from({length:nStills(p)},(_,k)=>`<figure><button data-still="${k+1}" data-cursor="zoom" aria-label="Still ${k+1}">${frame(p.pal,stillSeed(p,k+1),{ar:p.ar,img:sheetStill(p,k),tag:"STILL "+pad(k+1)})}</button>
      <figcaption class="mono muted">TC ${tcFrom(hash(p.id+"tc"+(k+1)))}</figcaption></figure>`).join("");
  const mk=Array.from({length:4},(_,k)=>`<figure data-cursor="color">${frame(p.pal,hash(p.id+"mk"+k),{img:p.bts&&p.bts[k]})}</figure>`).join("");
  sheet.innerHTML=`
    <div class="sheet-bar"><div class="wrap">
      <span class="mono muted">${pad(i+1)} / ${pad(PROJECTS.length)} · ${typeName(p.type)}</span>
      <button class="btn" id="closeSheet">${t("sheet.close")}</button>
    </div></div>
    <div class="wrap">
      <div class="sheet-head"><h2 class="sheet-title" id="sheetTitle">${esc(p.title)}</h2>
        <p class="mono muted">${esc(L(p.length))} · ${p.year} · ${p.ratio}</p></div>
      <div class="sheet-hero"><div class="screen corners">${frame(p.pal,stillSeed(p,0),{img:p.sheetPoster||stillImg(p,0),video:p.sheetVideo||p.video})}</div></div>
      <div class="sheet-info">
        <div>
          <p class="lede">${esc(L(p.log))}</p>
          <div class="reel"><div class="screen">${frame(p.pal,hash(p.id+"reel"))}
            <a class="play mono" href="${p.vimeo||"https://vimeo.com/"}" target="_blank" rel="noopener"><i aria-hidden="true"></i>${t("sheet.trailer")}</a></div></div>
        </div>
        <dl class="spec">
          <dt>${t("spec.role")}</dt><dd>${rolesTxt(p)}</dd>
          <dt>${t("spec.dir")}</dt><dd>${esc(p.director)}</dd>
          <dt>${t("spec.prod")}</dt><dd>${esc(p.prod)}</dd>
          <dt>${t("spec.cam")}</dt><dd>${esc(p.camera)}</dd>
          <dt>${t("spec.lens")}</dt><dd>${esc(p.lenses)}</dd>
          <dt>${t("spec.format")}</dt><dd>${esc(p.format)}</dd>
          <dt>${t("spec.ratio")}</dt><dd>${p.ratio}</dd>
        </dl>
      </div>
      <div class="sub-head"><h3>${t("sheet.frames")}</h3><span class="mono muted">${p.ratio}</span></div>
      <div class="stills">${stills}</div>
      <div class="sub-head"><h3>${t("sheet.mk")}</h3><span class="mono muted">${t("sheet.onset")}</span></div>
      <div class="mk">${mk}</div>
      <button class="next" data-next="${next.id}"><span class="mono muted">${t("sheet.next")}</span><b>${esc(next.title)} →</b></button>
    </div>`;
  if(sheet.hidden){lastFocus=document.activeElement; sheet.hidden=false; document.documentElement.style.overflow="hidden";}
  else { sheet.style.animation="none"; void sheet.offsetWidth; sheet.style.animation=""; }
  sheet.scrollTop=0; hideReticle();
  document.getElementById("closeSheet").focus();
}
function closeSheet(){sheet.hidden=true;currentId=null;document.documentElement.style.overflow="";hideReticle();if(lastFocus)lastFocus.focus()}
sheet.addEventListener("click",e=>{
  if(e.target.closest("#closeSheet")) return closeSheet();
  const n=e.target.closest("[data-next]"); if(n){e.stopPropagation(); openProject(n.dataset.next); return;}
  const s=e.target.closest("[data-still]"); if(s){const p=byId(currentId);
    openLb(Array.from({length:nStills(p)},(_,k)=>({pal:p.pal,seed:stillSeed(p,k+1),ar:p.ar,img:sheetStill(p,k),title:`${p.title} · Still ${pad(k+1)}`,meta:"TC "+tcFrom(hash(p.id+"tc"+(k+1)))})),+s.dataset.still-1)}
});

/* ============ LIGHTBOX ============ */
const lb=document.getElementById("lb"); let lbItems=[], lbI=0, lbFocus=null;
function drawLb(){
  const it=lbItems[lbI]; const ar=it.ar||1.5;
  const w=`min(100%, calc((100vh - 170px) * ${ar}))`;
  lb.innerHTML=`<button class="lb-btn lb-close" data-lb="close">${t("lb.close")}</button>
    <figure style="width:${w}">${frame(it.pal,it.seed,{ar,img:it.img})}
    <figcaption><span>${esc(it.title)}</span><span class="mono muted">${pad(lbI+1)} / ${pad(lbItems.length)} · ${esc(it.meta)}</span></figcaption></figure>
    ${lbItems.length>1?`<button class="lb-btn lb-prev" data-lb="prev">${t("lb.prev")}</button><button class="lb-btn lb-next" data-lb="next">${t("lb.next")}</button>`:""}`;
}
function openLb(items,i){lbItems=items;lbI=i;lbFocus=document.activeElement;lb.hidden=false;document.documentElement.style.overflow="hidden";drawLb();hideReticle();lb.querySelector(".lb-close").focus()}
function closeLb(){lb.hidden=true;if(sheet.hidden)document.documentElement.style.overflow="";if(lbFocus)lbFocus.focus()}
lb.addEventListener("click",e=>{const b=e.target.closest("[data-lb]");
  if(!b){ if(e.target===lb) closeLb(); return; }
  if(b.dataset.lb==="close") closeLb();
  else { lbI=(lbI+(b.dataset.lb==="next"?1:-1)+lbItems.length)%lbItems.length; drawLb(); lb.querySelector(`[data-lb="${b.dataset.lb}"]`).focus(); }
});
document.addEventListener("keydown",e=>{
  if(!lb.hidden){ if(e.key==="Escape")closeLb(); if(e.key==="ArrowRight"){lbI=(lbI+1)%lbItems.length;drawLb()} if(e.key==="ArrowLeft"){lbI=(lbI-1+lbItems.length)%lbItems.length;drawLb()} return; }
  if(!sheet.hidden && e.key==="Escape") closeSheet();
  if(introRunning && e.key==="Escape") endIntro();
});

/* ============ CURSOR-VISOR ============ */
const ret=document.getElementById("reticle"), retL=document.getElementById("reticleLabel");
const fine=matchMedia("(hover:hover) and (pointer:fine)").matches;
let mx=0,my=0,rx=0,ry=0,retOn=false;
function hideReticle(){ret.classList.remove("on");retOn=false}
if(fine){
  document.addEventListener("mousemove",e=>{mx=e.clientX;my=e.clientY;
    const el=e.target.closest("[data-cursor]");
    if(el){const k=el.dataset.cursor; retL.textContent=t("cur."+k); ret.classList.add("on"); ret.classList.toggle("big",k==="view"); if(!retOn){rx=mx;ry=my;retOn=true}}
    else hideReticle();
  });
  document.addEventListener("mouseleave",hideReticle);
  let retRaf=0;
  const retLoop=()=>{ retRaf=0; rx+=(mx-rx)*.22; ry+=(my-ry)*.22; ret.style.transform=`translate3d(${rx.toFixed(1)}px,${ry.toFixed(1)}px,0)`;
    if(retOn&&(Math.abs(mx-rx)>.3||Math.abs(my-ry)>.3)) retRaf=requestAnimationFrame(retLoop); };
  document.addEventListener("mousemove",()=>{ if(retOn&&!retRaf) retRaf=requestAnimationFrame(retLoop); });
}

/* ============ progrés de lectura i secció activa ============ */
const prog=document.getElementById("progress"), navLinks=[...document.querySelectorAll(".nav a")];
function onScroll(){
  const h=document.documentElement.scrollHeight-innerHeight; prog.style.transform=`scaleX(${h>0?(scrollY/h).toFixed(4):0})`;
  let cur=null; for(const a of navLinks){const s=document.querySelector(a.getAttribute("href")); if(s && s.getBoundingClientRect().top<innerHeight*.4) cur=a;}
  navLinks.forEach(a=>a.classList.toggle("cur",a===cur));
}
addEventListener("scroll",onScroll,{passive:true}); onScroll();

/* ============ menú, correu, idioma ============ */
const menuBtn=document.getElementById("menuBtn"), nav=document.getElementById("nav");
menuBtn.addEventListener("click",()=>{const o=nav.classList.toggle("open");menuBtn.setAttribute("aria-expanded",o);menuBtn.textContent=o?t("menu.close"):t("menu")});
nav.addEventListener("click",e=>{if(e.target.closest("a")){nav.classList.remove("open");menuBtn.setAttribute("aria-expanded","false");menuBtn.textContent=t("menu")}});
document.getElementById("copyMail").addEventListener("click",e=>{
  const b=e.currentTarget, mail=document.getElementById("mail").textContent;
  const done=()=>{b.textContent=t("contact.copied");setTimeout(()=>b.textContent=t("contact.copy"),1800)};
  const fallback=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("mail"));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent=t("contact.selected")};
  try{navigator.clipboard.writeText(mail).then(done,fallback)}catch(_){fallback()}
});
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el=>el.innerHTML=t(el.dataset.i18nHtml));
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  menuBtn.textContent=nav.classList.contains("open")?t("menu.close"):t("menu");
  renderFilters(); renderWork(); renderPhotos(); renderBts(); renderAbout(); renderTabs(); setCap();
  if(!sheet.hidden && currentId) openProject(currentId);
  if(!lb.hidden) drawLb();
}
document.querySelector(".lang").addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b)return;
  lang=b.dataset.lang; try{localStorage.setItem("bva-lang",lang)}catch(_){} applyLang()});

/* ============ INTRO (dins la portada) ============ */
const heroEl=document.getElementById("heroScreen"), heroSlot=document.getElementById("heroSlot"), introTitle=document.getElementById("introTitle");
let introTimers=[], introRunning=false, introToken=0, blurLayer=null;
const variant="c";
function buildTitle(){
  const line=w=>{ const ch=[...w], c=(ch.length-1)/2; return `<span class="ln">${ch.map((x,i)=>`<span class="ch" style="--o:${(i-c).toFixed(1)}">${x}</span>`).join("")}</span>`; };
  const name=line("Boi Vidal")+line("Albert");
  introTitle.innerHTML=`<div class="it-wrap"><div class="it-name"><span class="half top">${name}</span><span class="half bot">${name}</span></div><p class="it-tag mono">${t("hero.roles")}</p></div>`;
}
/* espera la tipografia (màxim 1,2 s) perquè el nom no canviï de lletra a mitja animació */
function fontsReady(){
  if(!document.fonts||!document.fonts.load) return Promise.resolve();
  return Promise.race([document.fonts.load('800 100px "Big Shoulders Display"'), new Promise(r=>setTimeout(r,1200))]).catch(()=>{});
}
function endIntro(){
  introToken++; introTimers.forEach(clearTimeout); introTimers=[]; introRunning=false;
  heroEl.classList.remove("landing"); heroEl.style.transform=""; heroEl.style.willChange="";
  if(blurLayer){ blurLayer.remove(); blurLayer=null; }
  document.body.classList.remove("intro-on","intro-wait","settle","t-in","t-out");
  introTitle.innerHTML="";
  document.documentElement.style.overflow=(sheet.hidden&&lb.hidden)?"":"hidden";
  document.body.classList.add("go"); startHero();
}
function playIntro(){
  if(reduce){ endIntro(); return; }
  const token=++introToken; introTimers.forEach(clearTimeout); introTimers=[]; introRunning=true; stopHero();
  scrollTo({top:0,behavior:"instant"}); document.documentElement.style.overflow="hidden";
  const bc=document.body.classList;
  bc.remove("go","settle","t-in","t-out"); bc.add("v-"+variant,"intro-on","intro-wait");
  slidesEl.style.transform="";
  /* còpia desenfocada de la imatge actual */
  if(blurLayer) blurLayer.remove();
  const p=featured[heroI]; blurLayer=document.createElement("div"); blurLayer.className="blur-layer";
  if(heroVideo){
    blurLayer.innerHTML=`<video src="${heroVideo.getAttribute("src")}" poster="${heroVideo.getAttribute("poster")}" autoplay muted loop playsinline aria-hidden="true"></video>`;
    const bv=blurLayer.firstChild; try{ bv.currentTime=heroVideo.currentTime }catch(_){} bv.play().catch(()=>{});
  } else blurLayer.innerHTML=frame(p.pal,stillSeed(p,0),{img:stillImg(p,0)});
  slidesEl.after(blurLayer);
  /* FLIP: el monitor es queda al seu lloc i s'amplia amb transform fins a cobrir la pantalla */
  heroEl.classList.remove("landing");
  const r=heroSlot.getBoundingClientRect(), W=innerWidth, H=Math.min(innerHeight,(window.screen&&screen.height)||innerHeight);
  const k=Math.max(W/r.width,H/r.height), tx=W/2-r.left-r.width*k/2, ty=H/2-r.top-r.height*k/2;
  heroEl.style.transform=`translate3d(${tx.toFixed(1)}px,${ty.toFixed(1)}px,0) scale(${k.toFixed(4)})`;
  void heroEl.offsetWidth; heroEl.style.willChange="transform";
  buildTitle();
  fontsReady().then(()=>new Promise(r=>(window.requestIdleCallback?requestIdleCallback(r,{timeout:700}):setTimeout(r,250)))).then(()=>{
    if(token!==introToken) return;
    requestAnimationFrame(()=>{ if(token!==introToken) return;
      bc.remove("intro-wait");
      const at=(ms,fn)=>introTimers.push(setTimeout(()=>{ if(token===introToken) fn(); },ms));
      at(80,()=>bc.add("t-in"));
      at(2150,()=>{ bc.remove("t-in"); bc.add("t-out"); });
      at(2850,()=>{ bc.add("settle"); heroEl.classList.add("landing"); heroEl.style.transform="translate3d(0,0,0) scale(1)"; });
      at(3900,endIntro);
    });
  });
}
document.getElementById("skipIntro").addEventListener("click",e=>{e.stopPropagation();endIntro()});
addEventListener("resize",()=>{if(introRunning)endIntro()});

document.getElementById("replay").addEventListener("click",()=>playIntro());

/* ============ arrencada ============ */
applyLang();
/* la intro espera que la pàgina sigui visible (el visor pot carregar-la en segon pla) */
function startWhenVisible(){
  if(document.visibilityState==="visible"){ playIntro(); return; }
  endIntro();
  const once=()=>{ if(document.visibilityState==="visible"){ document.removeEventListener("visibilitychange",once); playIntro(); } };
  document.addEventListener("visibilitychange",once);
}
startWhenVisible();
</script>
