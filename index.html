<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boi Vidal Albert</title>
<meta name="description" content="Cinematographer, camera operator and camera assistant, based in Barcelona and available worldwide.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="preload" as="video" href="media/primera-noche-loop.mp4">
<style>
/* =========================================================
   V2 — minimal editorial, a tot l'ample.
   El fons (textures, moviment) es tractarà més endavant:
   tot queda preparat a .bg (ara desactivat).
   ========================================================= */
:root{
  --paper:#f1efea; --ink:#121212; --muted:#8b877f; --line:rgba(18,18,18,.12);
  --display:"Inter Tight",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.7,0,.2,1);
  --gut:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:clip}
body{background:var(--paper);color:var(--ink);font-family:var(--display);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img,video{display:block;width:100%;height:100%;object-fit:cover}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.02em;text-transform:uppercase;line-height:1.45}
.muted{color:var(--muted)}
em{font-style:italic}

/* fons (pendent de definir) */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ============ ESTRUCTURA A TOT L'AMPLE ============ */
.page{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column}
.top,.foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:16px var(--gut);flex:none;transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .8s ease}
.top .r,.foot .r{display:flex;justify-content:flex-end;gap:18px;align-items:center}
.nav{display:flex;gap:18px}
.nav a{position:relative}
.nav a.cur::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:currentColor}
.nav a:hover,.foot a:hover,.foot button:hover{color:var(--muted)}
.lang{display:flex;gap:8px}
.lang button{opacity:.4}.lang button.on{opacity:1}
.main{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;opacity:0;visibility:hidden;transform:translateY(12px);
  transition:opacity .5s ease,transform .6s var(--ease),visibility 0s .5s;scrollbar-width:thin}
.view.on{opacity:1;visibility:visible;transform:none;transition:opacity .6s ease .1s,transform .7s var(--ease) .1s}
.pad{padding:24px var(--gut) 90px}

/* ============ INICI: tira vertical de loops ============ */
#v-inici{overflow:hidden}
.stage{position:absolute;inset:0;--aw:560px;--ah:315px}
.mask{position:absolute;inset:0;pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 16%,#000 84%,transparent 100%);
          mask-image:linear-gradient(to bottom,transparent 0,#000 16%,#000 84%,transparent 100%)}
.strip{position:absolute;left:50%;top:0;display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:auto;
  transform:translateX(-50%);transition:transform .8s var(--ease);will-change:transform}
.s-item{position:relative;width:76px;height:46px;flex:none;background:#1a1916;
  transition:width .8s var(--ease),height .8s var(--ease),opacity .6s ease}
.s-item img,.s-item video{position:absolute;inset:0}
.s-item img{filter:blur(2px) grayscale(.35);transition:filter .6s ease}
.s-item:hover img{filter:none}
.s-item.active{width:var(--aw);height:var(--ah);cursor:pointer}
.s-item.active img{filter:none}
.corner{position:absolute;width:12px;height:12px;border:1px solid var(--ink);opacity:0;transition:opacity .4s ease .35s;z-index:2}
.c1{top:-9px;left:-9px;border-right:0;border-bottom:0}.c2{top:-9px;right:-9px;border-left:0;border-bottom:0}
.c3{bottom:-9px;left:-9px;border-right:0;border-top:0}.c4{bottom:-9px;right:-9px;border-left:0;border-top:0}
.s-item.active .corner{opacity:1}
.rec{position:absolute;top:10px;left:12px;z-index:2;display:flex;align-items:center;gap:6px;color:#fff;opacity:0;transition:opacity .4s ease .4s;font-family:var(--mono);font-size:10px}
.rec i{width:6px;height:6px;border-radius:50%;background:#e23b2e;animation:blink 1.4s steps(2) infinite}
.s-item.active .rec{opacity:.9}
@keyframes blink{50%{opacity:0}}
.meta{position:absolute;top:50%;transform:translateY(-50%);z-index:2;pointer-events:none;transition:opacity .8s ease}
.meta-l{right:calc(50% + var(--aw)/2 + 26px);text-align:right}
.meta-r{left:calc(50% + var(--aw)/2 + 26px)}
.meta span{display:block;transition:opacity .35s ease,transform .35s ease}
.meta.swap span{opacity:0;transform:translateY(4px)}
.hint{position:absolute;bottom:4px;left:var(--gut)}
.hint-r{position:absolute;bottom:4px;right:var(--gut);text-align:right}

/* ============ INTRO (com la v1: vídeo a pantalla completa → nom → obturador → s'encaixa) ============ */
.intro-on .top{transform:translateY(-110%)}
.intro-on .foot,.intro-on .meta,.intro-on .hint,.intro-on .hint-r{opacity:0}
.intro{position:fixed;z-index:200;left:0;top:0;width:100vw;height:100vh;background:#000;overflow:hidden;display:none}
.intro-on .intro{display:block}
.intro.landing{transition:left 1s cubic-bezier(.75,0,.2,1),top 1s cubic-bezier(.75,0,.2,1),width 1s cubic-bezier(.75,0,.2,1),height 1s cubic-bezier(.75,0,.2,1)}
.intro video.sharp{position:absolute;inset:0}
/* desenfocament barat: còpia petita, desenfocada i ampliada */
.intro .blur{position:absolute;left:-3%;top:-3%;width:26.5%;height:26.5%;transform-origin:0 0;transform:scale(4);
  filter:blur(4px) brightness(.5) saturate(.85);transition:opacity .55s ease}
.t-out .intro .blur{opacity:0}
.it{position:fixed;inset:0;z-index:210;display:none;place-items:center;pointer-events:none;text-align:center;padding:0 6vw}
.intro-on .it{display:grid}
.intro-on.settle .it{display:none}
.it-wrap{display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2vw,24px);opacity:0;transition:opacity .9s ease}
.t-in .it-wrap,.t-out .it-wrap{opacity:1}
.it-name{position:relative;font-weight:600;text-transform:uppercase;line-height:.86;letter-spacing:-.045em;font-size:clamp(3.4rem,13vw,12.5rem);color:#f3eee6}
.it-name .ln{display:block;white-space:nowrap}
.it-name .ch{display:inline-block;white-space:pre;transform:translate3d(calc(var(--o) * .24em),0,0);transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
.t-in .it-name .ch,.t-out .it-name .ch{transform:none}
.half{display:block;transition:transform .7s cubic-bezier(.75,0,.25,1)}
.half.top{clip-path:inset(0 0 50% 0)}
.half.bot{position:absolute;inset:0;clip-path:inset(50% 0 0 0)}
.t-out .half.top{transform:translate3d(0,-85vh,0)}
.t-out .half.bot{transform:translate3d(0,85vh,0)}
.it-tag{color:rgba(255,255,255,.82);letter-spacing:.18em}
.t-out .it-tag{opacity:0;transition:opacity .15s}
.flash{position:absolute;inset:0;background:#fff;opacity:0}
.t-out .flash{animation:flash .35s ease-out}
@keyframes flash{0%{opacity:.45}100%{opacity:0}}
.intro-wait .intro::after{content:"";position:absolute;inset:0;background:#000}

/* ============ MENÚ: selector de projectes en anell ============ */
.menu{position:fixed;inset:0;z-index:150;background:#050505;color:#f1efea;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s .6s;overflow:hidden}
.menu.on{opacity:1;visibility:visible;transition:opacity .6s ease}
.menu .close{position:absolute;top:16px;right:var(--gut);z-index:3}
.menu .brand{position:absolute;top:16px;left:var(--gut);z-index:3}
.scene{position:absolute;inset:0;perspective:1500px;display:grid;place-items:center}
.tilt{transform-style:preserve-3d;transform:rotateX(-22deg) rotateZ(-11deg) scale(.6);transition:transform 1.4s var(--ease)}
.menu.on .tilt{transform:rotateX(-22deg) rotateZ(-11deg) scale(1)}
.ring{transform-style:preserve-3d;animation:spin 80s linear infinite}
.menu:not(.on) .ring{animation-play-state:paused}
.ring:hover{animation-play-state:paused}
@keyframes spin{to{transform:rotateY(-360deg)}}
.tile{position:absolute;left:calc(var(--tw) / -2);top:calc(var(--th) / -2);width:var(--tw);height:var(--th);
  transform:rotateY(calc(var(--i) * var(--step))) translateZ(var(--r));overflow:hidden;background:#222}
.tile img{transition:filter .4s ease,transform .8s var(--ease);filter:brightness(.85)}
.tile:hover img{filter:brightness(1.1);transform:scale(1.05)}
.tile span{position:absolute;left:8px;bottom:6px;font-family:var(--mono);font-size:10px;text-transform:uppercase;color:#fff;opacity:0;transition:opacity .3s}
.tile:hover span{opacity:1}
.center{position:absolute;inset:0;z-index:2;display:grid;place-items:center;pointer-events:none;text-align:center}
.center>div{pointer-events:auto}
.center .bigl a{display:block;font-weight:600;text-transform:uppercase;letter-spacing:-.03em;font-size:clamp(26px,3.4vw,48px);line-height:1.08;transition:opacity .3s}
.center .bigl a:hover{opacity:.55}
.center .small{margin-top:18px;display:flex;gap:10px;justify-content:center;align-items:center}
.center .small i{display:inline-block;width:22px;height:1px;background:currentColor}
.center .small a:hover{opacity:.55}

/* ============ TREBALLS ============ */
.head{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:end;margin-bottom:28px}
.big{font-size:clamp(46px,8.4vw,128px);font-weight:500;line-height:.86;letter-spacing:-.045em;text-transform:uppercase}
.big sup{font-family:var(--mono);font-size:12px;letter-spacing:0;vertical-align:top;margin-left:6px;font-weight:400}
.filters{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.fgroup{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.fgroup b{font-weight:400;color:var(--muted);width:72px}
.chip{padding:2px 0;opacity:.45;transition:opacity .2s}
.chip:hover{opacity:.8}
.chip.on{opacity:1}.chip.on::before{content:"[ "}.chip.on::after{content:" ]"}
.rule{height:1px;background:var(--line);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:34px 14px}
.card{display:block}
.card .ph{position:relative;aspect-ratio:16/9;overflow:hidden;background:#1a1916}
.card .ph video{position:absolute;inset:0;opacity:0;transition:opacity .5s}
.card:hover .ph video{opacity:1}
.card img{transition:transform 1.2s var(--ease)}
.card:hover img{transform:scale(1.03)}
.card .cap{display:flex;justify-content:space-between;margin-top:8px;gap:10px}
.card.hide{display:none}
.empty{display:none;padding:40px 0}

/* ============ PROJECTE ============ */
.p-top{display:flex;justify-content:space-between;margin-bottom:40px}
.p-title{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:end;margin-bottom:34px}
.p-title .log{font-size:clamp(18px,1.6vw,24px);line-height:1.2;letter-spacing:-.01em;margin-top:16px;max-width:34ch}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 12px}
.kv dt{color:var(--muted)}
.label{display:flex;justify-content:space-between;margin:56px 0 14px}
.hero-v{position:relative;overflow:hidden;background:#000}
.film{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 var(--gut) 26px;margin:0 calc(var(--gut) * -1);scrollbar-width:thin}
.film figure{flex:none;height:min(50vh,440px);scroll-snap-align:center;position:relative;padding:clamp(14px,2.4vw,34px);background:var(--mat,#2a2723);cursor:zoom-in}
.film figure img{height:100%;width:auto;max-width:none;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.film figcaption{position:absolute;left:0;bottom:-20px}
.credits{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 14px;border-top:1px solid var(--line);padding-top:16px}
.next{display:block;margin-top:80px;border-top:1px solid var(--line);padding-top:16px}
.next .big{transition:color .3s}.next:hover .big{color:var(--muted)}

/* ============ FOTO / BTS ============ */
.masonry{columns:3 260px;column-gap:14px}
.masonry figure{break-inside:avoid;margin-bottom:24px;cursor:zoom-in}
.masonry .ph{overflow:hidden;background:#d9d6cf}
.masonry figcaption{margin-top:6px;display:flex;justify-content:space-between}
.bw img{filter:grayscale(1);transition:filter .7s ease}
.bw figure:hover img{filter:none}
.slot{aspect-ratio:4/5;display:grid;place-items:center;background:repeating-linear-gradient(135deg,#e5e2db 0 10px,#ebe8e2 10px 20px);color:var(--muted)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:180;background:rgba(8,8,8,.94);display:none;place-items:center;padding:60px var(--gut);cursor:zoom-out}
.lb.on{display:grid}
.lb img{width:auto;height:auto;max-width:100%;max-height:84vh;object-fit:contain}
.lb .mono{position:absolute;color:#f1efea}
.lb .x{top:16px;right:var(--gut)}.lb .cnt{top:16px;left:var(--gut)}

/* ============ SOBRE MI ============ */
.about{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.lead{font-size:clamp(22px,2.6vw,38px);line-height:1.08;letter-spacing:-.02em;font-weight:500;max-width:24ch}
.rows{margin-top:40px}
.row{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row .sub{display:block;color:var(--muted);text-transform:none;letter-spacing:0;font-family:var(--display);font-size:13px;margin-top:2px}
.portrait{aspect-ratio:4/5;max-width:420px}
.cv{width:100%;border-collapse:collapse}
.cv td{padding:10px 0;border-top:1px solid var(--line);vertical-align:top}
.cv td:last-child{text-align:right}
.cv button{text-transform:uppercase;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}

/* ============ CONTACTE ============ */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:20px;min-height:100%;align-content:center}
.links a,.links button{display:flex;align-items:baseline;gap:14px;text-align:left}
.links .big{transition:transform .5s var(--ease),color .3s}
.links a:hover .big,.links button:hover .big{transform:translateX(14px);color:var(--muted)}
.links .mono{opacity:0;transition:opacity .3s}
.links a:hover .mono,.links button:hover .mono{opacity:1}

/* ============ RESPONSIVE ============ */
@media (max-width:900px){.credits{grid-template-columns:repeat(2,1fr)}}
@media (max-width:720px){
  :root{--gut:14px}
  .top{grid-template-columns:1fr auto;padding:12px var(--gut)}
  .top .nav{display:none}
  .foot{display:none}
  .head,.p-title,.about,.contact,.grid{grid-template-columns:1fr}
  .film figure{height:auto;width:86vw}.film figure img{width:100%;height:auto}
  .meta-l{right:auto;left:var(--gut);top:14px;transform:none;text-align:left}
  .meta-r{left:auto;right:var(--gut);top:auto;bottom:44px;transform:none;text-align:right}
  .s-item.far{opacity:0!important;pointer-events:none}
  .hint-r{display:none}
  .row{grid-template-columns:110px 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>
</head>
<body class="intro-on intro-wait">

<div class="bg" aria-hidden="true"></div>

<!-- INTRO -->
<div class="intro" id="intro" aria-hidden="true"></div>
<div class="it" id="it" aria-hidden="true"><div id="itTitle"></div><div class="flash"></div></div>

<!-- MENÚ (anell de projectes) -->
<div class="menu" id="menu" aria-hidden="true">
  <a class="brand mono" href="#inici">Boi Vidal Albert</a>
  <button class="close mono" id="menuClose" data-i18n="menu.close">Tancar ✕</button>
  <div class="scene"><div class="tilt"><div class="ring" id="ring"></div></div></div>
  <div class="center">
    <div>
      <div class="bigl">
        <a href="#treballs" data-i18n="nav.work">Treballs</a>
        <a href="#fotografies" data-i18n="nav.photos">Fotografies</a>
        <a href="#bts">BTS</a>
      </div>
      <div class="small mono"><a href="#sobre" data-i18n="nav.about">Sobre mi</a><i></i><a href="#contacte" data-i18n="nav.contact">Contacte</a></div>
    </div>
  </div>
</div>

<div class="lb" id="lb"><span class="mono cnt" id="lbCnt"></span><span class="mono x" data-i18n="lb.close">Tancar ✕</span><img id="lbImg" alt=""></div>

<div class="page">
  <header class="top mono">
    <a href="#inici">Boi Vidal Albert</a>
    <nav class="nav">
      <a href="#treballs" data-i18n="nav.work">Treballs</a>
      <a href="#fotografies" data-i18n="nav.photos">Fotografies</a>
      <a href="#bts">BTS</a>
      <a href="#sobre" data-i18n="nav.about">Sobre mi</a>
      <a href="#contacte" data-i18n="nav.contact">Contacte</a>
    </nav>

      <div class="lang"><button data-lang="ca">CA</button><button data-lang="es">ES</button><button data-lang="en">EN</button></div>

  <main class="main">
    <!-- INICI -->

      <div class="stage" id="stage">
        <div class="mask"><div class="strip" id="strip"></div></div>
        <div class="meta meta-l mono"><span class="muted" id="m-idx"></span><span id="m-title"></span></div>
        <div class="meta meta-r mono"><span class="muted" id="m-year"></span><span id="m-role"></span></div>
        <div class="hint mono muted" data-i18n="hint.home"></div>
        <div class="hint-r mono muted" data-i18n="hero.roles"></div>
      </div>
    </section>

    <!-- TREBALLS -->
    <section class="view" data-view="treballs">
      <div class="pad">
        <div class="head">
          <h1 class="big"><span data-i18n="work.title"></span><sup id="count"></sup></h1>
          <div class="filters mono">
            <div class="fgroup" data-key="type"><b data-i18n="f.type"></b></div>

        </div>

        <div class="masonry mono" id="photos"></div>
      </div>

    <section class="view" data-view="bts">
      <div class="pad">
        <div class="head">
          <h1 class="big">Behind<br>the scenes</h1>

    <!-- SOBRE MI -->
    <section class="view" data-view="sobre">
      <div class="pad about">
        <div>

            <div class="row"><span class="muted" data-i18n="fact.base"></span><span data-i18n="hero.loc"></span></div>
            <div class="row"><span class="muted" data-i18n="fact.travel"></span><span data-i18n="fact.travel.v"></span></div>
            <div class="row"><span class="muted" data-i18n="fact.lang"></span><span data-i18n="fact.lang.v"></span></div>
            <div class="row"><span class="muted" data-i18n="about.edu"></span><span>ESCAC<span class="sub" data-i18n="edu.v"></span></span></div>
          </div>
          <p class="mono muted" style="margin:40px 0 8px" data-i18n="about.exp"></p>
          <table class="cv mono" id="cv"></table>
        </div>
      </div>
    </section>

    <!-- CONTACTE -->
    <section class="view" data-view="contacte">
      <div class="pad contact">
        <p class="mono muted"><span data-i18n="contact.kicker"></span><br><br><span data-i18n="hero.loc"></span></p>
        <div class="links">
          <button id="copyMail"><span class="big">Email</span><span class="mono" id="mailLbl">contacte@boividalalbert.com</span></button>

let cur=0;
strip.innerHTML=ENTRIES.map((e,i)=>`

    <span class="rec"><i></i>REC</span>

function activeVideo(){ return items[cur].querySelector("video"); }
function playActive(time){
  items.forEach((el,i)=>{ const v=el.querySelector("video"); if(i!==cur&&v){v.pause();v.remove();} });
  const el=items[cur]; let v=el.querySelector("video");
  if(!v){ v=document.createElement("video"); v.muted=true; v.loop=true; v.playsInline=true; v.setAttribute("playsinline","");

  if(time!=null){ try{v.currentTime=time}catch(_){} }
  v.play().catch(()=>{});
}
function layoutStrip(){
  const w=stage.clientWidth, h=stage.clientHeight; if(!w||!h) return;
  let aw=Math.min(w*(w<720?.88:.5), 820), ah=aw*9/16;
  if(ah>h*.64){ah=h*.64;aw=ah*16/9;}
  stage.style.setProperty("--aw",aw+"px"); stage.style.setProperty("--ah",ah+"px");
  strip.style.transform=`translate(-50%, ${h/2-(cur*(46+14)+ah/2)}px)`;
  items.forEach((el,i)=>{ const d=Math.abs(i-cur);
    el.classList.toggle("active",i===cur); el.classList.toggle("far",d>1);
    el.style.opacity=i===cur?1:Math.max(.15,1-d*.2); });
}
function setMeta(){
  const e=ENTRIES[cur];
  $("#m-idx").textContent=`${pad(cur+1)}/${pad(ENTRIES.length)}`;
  $("#m-title").textContent=e.p.title;
  $("#m-year").textContent=`${e.p.year} — ${L(e.p.length)}`;

}
function go(i,force){
  const n=Math.max(0,Math.min(ENTRIES.length-1,i));
  if(n===cur&&!force) return;
  cur=n;
  const metas=$$(".meta"); metas.forEach(m=>m.classList.add("swap"));
  setTimeout(()=>{ setMeta(); metas.forEach(m=>m.classList.remove("swap")); },250);
  layoutStrip(); if(!introRunning) playActive();
}

/* ============ INTRO ============ */
const introEl=$("#intro"), itTitle=$("#itTitle");
let introRunning=false, introToken=0, introTimers=[];
function buildTitle(){
  const line=w=>{const ch=[...w],c=(ch.length-1)/2;return `<span class="ln">${ch.map((x,i)=>`<span class="ch" style="--o:${(i-c).toFixed(1)}">${x}</span>`).join("")}</span>`;};

}
function endIntro(){
  introToken++; introTimers.forEach(clearTimeout); introTimers=[];
  const iv=introEl.querySelector("video.sharp"); const time=iv?iv.currentTime:null;
  introRunning=false;
  document.body.classList.remove("intro-on","intro-wait","settle","t-in","t-out");
  introEl.classList.remove("landing"); introEl.removeAttribute("style"); introEl.innerHTML=""; itTitle.innerHTML="";
  if(view==="inici") playActive(time);
}
function playIntro(){
  if(reduce){ endIntro(); return; }
  if(location.hash && location.hash!=="#inici"){ location.hash="inici"; }
  const token=++introToken; introTimers.forEach(clearTimeout); introTimers=[]; introRunning=true;
  go(0,true); items.forEach(el=>{const v=el.querySelector("video"); if(v){v.pause();v.remove();}});
  const bc=document.body.classList;
  bc.remove("settle","t-in","t-out"); bc.add("intro-on","intro-wait");
  introEl.classList.remove("landing"); introEl.removeAttribute("style");
  const src=vsrc(ENTRIES[0].v), poster=ENTRIES[0].poster;
  introEl.innerHTML=`<video class="sharp" src="${src}" poster="${poster}" autoplay muted loop playsinline></video>
    <div class="blur"><video src="${src}" poster="${poster}" autoplay muted loop playsinline></video></div>`;
  const [sharp,soft]=$$("video",introEl); [sharp,soft].forEach(v=>{v.muted=true;v.play().catch(()=>{})});
  buildTitle();
  const fonts=document.fonts&&document.fonts.load?Promise.race([document.fonts.load('600 100px "Inter Tight"'),new Promise(r=>setTimeout(r,1200))]).catch(()=>{}):Promise.resolve();
  fonts.then(()=>new Promise(r=>setTimeout(r,200))).then(()=>{
    if(token!==introToken) return;
    requestAnimationFrame(()=>{ if(token!==introToken) return;
      bc.remove("intro-wait");
      const at=(ms,fn)=>introTimers.push(setTimeout(()=>{ if(token===introToken) fn(); },ms));
      at(80,()=>bc.add("t-in"));
      at(2150,()=>{ bc.remove("t-in"); bc.add("t-out"); try{soft.currentTime=sharp.currentTime}catch(_){} });
      at(2850,()=>{                                   /* el vídeo s'encaixa al fotograma actiu de la tira */

        introEl.classList.add("landing");
        Object.assign(introEl.style,{left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px"});
      });
      at(3950,endIntro);
    });
  });
}

    </a>`).join("");
  $$(".card").forEach(c=>{ const v=$("video",c);
    c.addEventListener("mouseenter",()=>{ if(!v.src) v.src=v.dataset.src; v.play().catch(()=>{}); });
    c.addEventListener("mouseleave",()=>v.pause()); });
  applyFilters();
}
function applyFilters(){
  let n=0;
  $$(".card").forEach(c=>{ const ok=(filt.type==="all"||c.dataset.type===filt.type)&&(filt.role==="all"||c.dataset.roles.split(",").includes(filt.role));
    c.classList.toggle("hide",!ok); if(ok) n++; });
  $("#count").textContent=`(${pad(n)})`; $("#empty").style.display=n?"none":"block";
}

/* ============ PROJECTE ============ */
let lbList=[], lbI=0;
function renderProject(id){
  const i=Math.max(0,PROJECTS.findIndex(p=>p.id===id)), p=PROJECTS[i], nx=PROJECTS[(i+1)%PROJECTS.length];
  const stills=[...new Set(p.stills)];
  $("#project").innerHTML=`
    <div class="p-top mono"><a href="#treballs">${t("back")}</a><span class="muted">${pad(i+1)}/${pad(PROJECTS.length)}</span></div>
    <div class="p-title">
      <div><h1 class="big">${p.title}</h1><p class="log">${L(p.log)}</p></div>
      <dl class="kv mono">
        <dt>${t("spec.role")}</dt><dd>${rolesTxt(p)}</dd>
        <dt>${t("f.type")}</dt><dd>${t("type."+p.type)} — ${L(p.length)}</dd>
        <dt>${t("spec.year")}</dt><dd>${p.year}</dd>
        <dt>${t("spec.ratio")}</dt><dd>${p.ratio}</dd>
      </dl>
    </div>
    <div class="hero-v" style="aspect-ratio:${p.ratio==="2.39:1"?"2.39/1":"16/9"}"><video src="${vsrc(p.sheetVideo)}" poster="${p.sheetPoster}" autoplay muted loop playsinline></video></div>

    <div class="label mono"><span>[ ${t("sheet.frames")} ]</span><span class="muted">${pad(stills.length)} · ${t("slide")}</span></div>
    <div class="film mono" style="--mat:${p.mat}">
      ${stills.map((s,n)=>`<figure data-n="${n}"><img loading="lazy" src="${s}" alt="${t("still")} ${n+1}"><figcaption class="muted">${pad(n+1)}</figcaption></figure>`).join("")}
    </div>

    <div class="label mono"><span>[ ${t("sheet.loop")}s ]</span><span class="muted">${pad(p.stripVideos.length)}</span></div>
    <div class="grid" style="grid-template-columns:repeat(${MOB?1:3},1fr)">
      ${p.stripVideos.map(([v,po])=>`<div class="hero-v" style="aspect-ratio:16/9"><video src="${vsrc(v)}" poster="${po}" autoplay muted loop playsinline preload="metadata"></video></div>`).join("")}
    </div>

    <div class="label mono"><span>[ Credits ]</span><span></span></div>
    <div class="credits mono">
      <div><span class="muted">${t("spec.dir")}</span><br>${p.director}</div>
      <div><span class="muted">${t("spec.prod")}</span><br>${p.prod}</div>
      <div><span class="muted">${t("spec.role")}</span><br>${rolesTxt(p)}</div>
      <div><span class="muted">${t("spec.cam")}</span><br>${p.camera}</div>
      <div><span class="muted">${t("spec.lens")}</span><br>${p.lenses}</div>
      <div><span class="muted">${t("spec.format")}</span><br>${p.format}</div>
      <div><span class="muted">${t("spec.ratio")}</span><br>${p.ratio}</div>
      <div><span class="muted">${t("spec.year")}</span><br>${p.year}</div>
    </div>

    <a class="next" href="#projecte/${nx.id}"><span class="mono muted">${t("sheet.next")}</span><div class="big" style="margin-top:8px">${nx.title} →</div></a>`;
  $$(".film figure").forEach(f=>f.addEventListener("click",()=>openLb(stills,+f.dataset.n)));
  $('[data-view="projecte"]').scrollTop=0;
}

/* ============ LIGHTBOX ============ */
const lb=$("#lb");
function openLb(list,i){ lbList=list; lbI=i; lbShow(); lb.classList.add("on"); }
function lbShow(){ $("#lbImg").src=lbList[lbI]; $("#lbCnt").textContent=`${pad(lbI+1)}/${pad(lbList.length)}`; }
function lbStep(d){ lbI=(lbI+d+lbList.length)%lbList.length; lbShow(); }
function closeLb(){ lb.classList.remove("on"); }
lb.addEventListener("click",closeLb);

/* ============ FOTO / BTS / SOBRE ============ */
let photoF="all";
function renderPhotos(){
  const f=$("#photoFilter");
  f.innerHTML=[["all",t("photos.all")],["analog",t("photos.analog")],["digital",t("photos.digital")]].map(([k,v])=>`<button class="chip${photoF===k?" on":""}" data-v="${k}">${v}</button>`).join("");
  const list=PHOTOS.filter(p=>photoF==="all"||p.kind===photoF);
  $("#photos").innerHTML=list.map((p,i)=>`<figure data-n="${i}"><div class="ph"><img loading="lazy" src="${p.img}" alt="${p.title}"></div><figcaption><span>${p.title}</span><span class="muted">${p.meta}</span></figcaption></figure>`).join("");
  $$("#photos figure").forEach(fg=>fg.addEventListener("click",()=>openLb(list.map(p=>p.img),+fg.dataset.n)));
}
$("#photoFilter").addEventListener("click",e=>{ const c=e.target.closest(".chip"); if(!c) return; photoF=c.dataset.v; renderPhotos(); });
function renderBts(){
  $("#bts").innerHTML=BTS.length
    ? BTS.map(b=>`<figure><div class="ph"><img loading="lazy" src="${b.img}" alt=""></div><figcaption><span>[ ${b.title} ]</span><span class="muted">Set</span></figcaption></figure>`).join("")
    : Array.from({length:6},()=>`<figure><div class="slot mono">${t("bts.soon")}</div></figure>`).join("");
}
function renderAbout(){
  $("#roles").innerHTML=ROLES.map(r=>`${roleName(r)}<span class="sub">${t("role."+r)}</span>`).join("<br>");
  $("#cv").innerHTML=PROJECTS.map(p=>`<tr><td class="muted">${p.year}</td><td><button data-id="${p.id}">${p.title}</button> <span class="muted">— ${L(p.length)}</span></td><td>${rolesTxt(p)}</td></tr>`).join("");
}
$("#cv").addEventListener("click",e=>{ const b=e.target.closest("[data-id]"); if(b) location.hash="projecte/"+b.dataset.id; });
$("#copyMail").addEventListener("click",async()=>{
  const m="contacte@boividalalbert.com";
  try{ await navigator.clipboard.writeText(m); $("#mailLbl").textContent=t("contact.copied"); setTimeout(()=>$("#mailLbl").textContent=m,1600); }
  catch(_){ location.href="mailto:"+m; }
});

/* ============ IDIOMA ============ */
function applyLang(){
  document.documentElement.lang=lang;
  $$("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  $$(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.lang===lang));
  renderFilters(); renderGrid(); renderPhotos(); renderBts(); renderAbout(); setMeta();
  if(view==="projecte") renderProject(location.hash.split("/")[1]);
}
$(".lang").addEventListener("click",e=>{ const b=e.target.closest("[data-lang]"); if(!b) return;
  lang=b.dataset.lang; try{localStorage.setItem("bva-lang",lang)}catch(_){} applyLang(); });

/* ============ ROUTER ============ */
let view="";
function route(){
  const [v="inici",arg]=(location.hash.slice(1)||"inici").split("/");
  const prev=view;
  view=$(`.view[data-view="${v}"]`)?v:"inici";
  if(view==="projecte") renderProject(arg);
  $$(".view").forEach(el=>el.classList.toggle("on",el.dataset.view===view));
  $$(".nav a").forEach(a=>a.classList.toggle("cur",a.hash.slice(1)===view||(view==="projecte"&&a.hash==="#treballs")));
  if(view==="inici"){ layoutStrip(); if(!introRunning) playActive(); }
  else { const av=activeVideo(); if(av) av.pause(); }
  if(prev==="projecte"&&view!=="projecte") $$("#project video").forEach(v=>v.pause());
  closeMenu();
}
addEventListener("hashchange",route);

/* ============ ARRENCADA ============ */
if(!location.hash||location.hash==="#inici") introRunning=true;
applyLang(); route(); layoutStrip(); setMeta();
if(view==="inici"){
  if(document.visibilityState==="visible") playIntro();
  else { endIntro(); document.addEventListener("visibilitychange",function once(){ if(document.visibilityState==="visible"){ document.removeEventListener("visibilitychange",once); playIntro(); } }); }
} else endIntro();
</script>
</body>
</html>
