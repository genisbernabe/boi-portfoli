<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Boi Vidal Albert — Cinematographer, camera operator & camera assistant. Barcelona, available worldwide.">
<title>Boi Vidal Albert</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: sala de projecció fosca. Cada imatge viu dins d'una pantalla negra amb la seva ràtio real (letterbox).
   Moment fort: intro de càmera (visor → claqueta → diafragma) i cursor-visor sobre les imatges. */
:root{
  --ink:#0e0d0c; --ink-2:#161412; --ink-3:#211e1b;
  --paper:#ebe4d8; --muted:#978e82; --line:rgba(235,228,216,.13);
  --tungsten:#d29c5c; --rec:#e0442f;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --gut-l:max(clamp(16px,4vw,56px),env(safe-area-inset-left,0px));
  --gut-r:max(clamp(16px,4vw,56px),env(safe-area-inset-right,0px));
  --head:60px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html{scroll-behavior:smooth;background:var(--ink);scrollbar-gutter:stable}
body{background:var(--ink);color:var(--paper);font:400 16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--tungsten);outline-offset:3px}
h1,h2,h3{margin:0;font-weight:800;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
.muted{color:var(--muted)}
.wrap{max-width:1440px;margin-inline:auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}

.grain{position:fixed;inset:-50%;z-index:300;pointer-events:none;opacity:.06;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}100%{transform:translate(0,0)}}

/* ================= CAPÇALERA ================= */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
.site-head{position:fixed;inset:0 0 auto;z-index:50;padding-top:env(safe-area-inset-top,0px);
  background:rgba(14,13,12,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.head-in{display:flex;align-items:center;gap:20px;height:var(--head)}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;display:flex;align-items:center;gap:10px;white-space:nowrap;margin-right:auto}
.rec{width:8px;height:8px;border-radius:50%;background:var(--rec);box-shadow:0 0 10px var(--rec);animation:blink 1.6s steps(2) infinite;flex:none}
@keyframes blink{50%{opacity:.25}}
.nav{display:flex;gap:26px}
.nav a{text-decoration:none;color:var(--muted);transition:color .2s}
.nav a:hover,.nav a.cur{color:var(--paper)}
.lang{display:flex;border:1px solid var(--line)}
.lang button{padding:5px 8px;color:var(--muted);font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em}
.lang button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.lang button:hover:not([aria-pressed="true"]){color:var(--paper)}
.menu-btn{display:none}
.head-progress{position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:var(--tungsten);transform-origin:0 50%;transform:scaleX(0)}
@media (max-width:900px){
  .menu-btn{display:block}
  .brand{font-size:1.1rem}
  .nav{position:fixed;inset:calc(var(--head) + env(safe-area-inset-top,0px)) 0 auto 0;flex-direction:column;gap:0;
    background:var(--ink);border-bottom:1px solid var(--line);padding:8px var(--gut-r) 20px var(--gut-l)}
  .nav:not(.open){display:none}
  .nav a{padding:14px 0;border-bottom:1px solid var(--line);font-size:.85rem}
}
@media (max-width:420px){.brand .bn{display:none}}
main{padding-top:calc(var(--head) + env(safe-area-inset-top,0px))}
section[id]{scroll-margin-top:calc(var(--head) + 24px)}

/* ================= FOTOGRAMES ================= */
.screen{position:relative;background:#000;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden;max-width:100%}
.frame{position:relative;overflow:hidden;background-color:var(--ink-3);width:100%;max-width:100%}
.frame.tall{width:auto;height:100%}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.6) 100%);pointer-events:none}
.frame .tag{position:absolute;left:10px;bottom:8px;z-index:1;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;color:rgba(255,255,255,.62)}

/* ================= HERO ================= */
.hero{padding-block:clamp(16px,3vw,32px) 0}
.hero-slot{position:relative;aspect-ratio:2.39/1;max-width:100%}
@media (max-width:700px){.hero-slot{aspect-ratio:4/5}}
.hero-screen{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto}

/* ===== INTRO: el reel arrenca a pantalla completa com un monitor i s'encaixa al seu lloc ===== */
.site-head{transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.reel-tabs,.hero-meta,main>section:not(.hero),footer{transition:opacity .9s ease .2s}
.intro-on .site-head{transform:translateY(-110%)}
.intro-on .reel-tabs,.intro-on .hero-meta,.intro-on main>section:not(.hero),.intro-on footer{opacity:0}
.intro-on .hero-name .w span{transform:translateY(105%)}
.hero-screen.flying{position:fixed;inset:auto;z-index:120}
.hero-screen.flying.land{transition:top 1s cubic-bezier(.75,0,.2,1),left 1s cubic-bezier(.75,0,.2,1),width 1s cubic-bezier(.75,0,.2,1),height 1s cubic-bezier(.75,0,.2,1)}
.intro-on #slides{animation:expose 1.75s cubic-bezier(.35,0,.25,1) both}
@keyframes expose{
  0%{filter:brightness(0) blur(26px)}
  30%{filter:brightness(.35) blur(20px)}
  62%{filter:brightness(.95) blur(4px)}
  74%{filter:brightness(1) blur(.4px)}
  84%{filter:brightness(1) blur(2.2px)}
  100%{filter:brightness(1) blur(0)}}
.vf-data{position:absolute;left:50%;bottom:clamp(44px,6vw,64px);transform:translateX(-50%);z-index:3;display:flex;gap:clamp(12px,2.4vw,28px);white-space:nowrap;
  color:rgba(255,255,255,.88);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .35s;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.vf-data b{font-weight:500;color:#fff}
.vf-cross{position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%);z-index:3;opacity:0;transition:opacity .35s;pointer-events:none}
.vf-cross::before,.vf-cross::after{content:"";position:absolute;background:rgba(255,255,255,.6)}
.vf-cross::before{left:50%;top:0;bottom:0;width:1px}.vf-cross::after{top:50%;left:0;right:0;height:1px}
.vf-safe{position:absolute;inset:10% 8%;border:1px solid rgba(255,255,255,.12);z-index:3;opacity:0;transition:opacity .35s;pointer-events:none}
.intro-on:not(.settle) .vf-data,.intro-on:not(.settle) .vf-cross,.intro-on:not(.settle) .vf-safe{opacity:1}
@media (max-width:600px){.vf-data .hs{display:none}}
.skip{position:fixed;z-index:130;left:50%;transform:translateX(-50%);top:max(18px,calc(env(safe-area-inset-top,0px) + 14px));padding:8px 12px;border:1px solid rgba(255,255,255,.35);color:#fff;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .3s}
.intro-on:not(.settle) .skip{opacity:1;pointer-events:auto}
.skip:hover{background:#fff;color:#000}
#slides{position:absolute;inset:0}
.slide{position:absolute;inset:-3%;opacity:0;transition:opacity 1.3s ease}
.slide.on{opacity:1}
.slide .frame{position:absolute;inset:0;height:100%;transform:scale(1.06);transition:transform 6s ease-out}
.slide.on .frame{transform:scale(1)}
.hud{position:absolute;inset:0;z-index:2;pointer-events:none;padding:clamp(14px,2vw,26px);display:flex;flex-direction:column;justify-content:space-between}
.hud-row{display:flex;justify-content:space-between;align-items:center;gap:12px;color:rgba(255,255,255,.85);text-shadow:0 1px 8px rgba(0,0,0,.6)}
.hud-row .mono{display:flex;align-items:center;gap:8px}
.tc{font-variant-numeric:tabular-nums}
.corners::before,.corners::after{content:"";position:absolute;width:28px;height:28px;border-color:rgba(255,255,255,.55);border-style:solid;z-index:2;pointer-events:none}
.corners::before{top:12px;left:12px;border-width:1px 0 0 1px}
.corners::after{bottom:12px;right:12px;border-width:0 1px 1px 0}
.reel-tabs{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:12px;margin-top:12px}
.reel-tabs button{text-align:left;padding-top:10px;color:var(--muted);transition:color .2s;min-width:0}
.reel-tabs button:hover,.reel-tabs button.on{color:var(--paper)}
.reel-tabs .bar{display:block;height:2px;background:var(--line);margin-bottom:8px;overflow:hidden}
.reel-tabs .bar i{display:block;height:100%;width:0;background:var(--paper)}
.reel-tabs button.on .bar i{animation:fill var(--dur,4.6s) linear forwards}
.reel-tabs button.done .bar i{width:100%}
.reel-tabs .tt{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes fill{to{width:100%}}
@media (max-width:600px){.reel-tabs .tn{display:none}}
.hero-id{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 40px;padding-block:clamp(28px,4vw,52px) clamp(20px,3vw,32px);border-bottom:1px solid var(--line)}
.hero-name{font-family:var(--f-display);font-weight:800;text-transform:uppercase;line-height:.85;letter-spacing:-.005em;font-size:clamp(3rem,9.6vw,8.8rem);min-width:0}
.hero-name .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.04em}
.hero-name .w span{display:inline-block}
.go .hero-name .w span{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.go .hero-name .w:nth-child(2) span{animation-delay:.08s}.go .hero-name .w:nth-child(3) span{animation-delay:.16s}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
.hero-meta{display:flex;flex-direction:column;gap:6px;text-align:right;color:var(--muted)}
.hero-meta strong{color:var(--paper);font-weight:500}
@media (max-width:700px){.hero-meta{text-align:left}}

/* intro */
.intro{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:clamp(24px,5vw,80px);align-items:end;padding-block:clamp(48px,7vw,96px)}
.intro .portrait{aspect-ratio:4/5}
.intro .portrait .frame{height:100%}
.lede{font-size:clamp(1.3rem,2.4vw,2rem);line-height:1.3;max-width:30ch;font-weight:500;text-wrap:balance}
.lede em{font-style:normal;color:var(--tungsten)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border:1px solid var(--line);text-decoration:none;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;transition:background .2s,border-color .2s,color .2s}
.btn:hover{border-color:var(--paper)}
.btn.solid{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.btn.solid:hover{background:var(--tungsten);border-color:var(--tungsten)}
@media (max-width:700px){.intro{grid-template-columns:1fr}.intro .portrait{max-width:260px}}

.sec{padding-block:clamp(56px,8vw,112px);border-top:1px solid var(--line)}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px 24px;margin-bottom:32px}
.sec-head h2{font-family:var(--f-display);font-size:clamp(2.6rem,7vw,5.5rem);text-transform:uppercase;line-height:.9}
.sec-head h2 sup{font-family:var(--f-mono);font-size:.8rem;font-weight:400;color:var(--muted);vertical-align:top;margin-left:6px;letter-spacing:.05em}

.filters{display:flex;flex-direction:column;gap:12px;margin-bottom:36px}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.frow .label{width:64px;color:var(--muted)}
.chip{padding:7px 12px;border:1px solid var(--line);font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);transition:all .2s}
.chip:hover{color:var(--paper);border-color:rgba(235,228,216,.4)}
.chip[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.toolbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.views{display:flex;gap:4px}

/* graella amb scrub */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:44px 24px}
.grid .card{animation:cardIn .5s ease both}
@keyframes cardIn{from{transform:translateY(14px);opacity:.3}to{transform:none;opacity:1}}
.card-btn{display:block;width:100%;text-align:left}
.stack{position:relative;width:100%;max-width:100%}
.stack.tall{width:auto;height:100%}
.stack .frame{position:absolute;inset:0;height:100%;opacity:0;transition:transform .6s ease}
.stack .frame.on{opacity:1}
.card .stack{filter:brightness(.8) saturate(.9);transition:filter .4s}
.card-btn:hover .stack,.card-btn:focus-visible .stack{filter:none}
.scrub{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:center;gap:10px;padding:8px 10px;opacity:0;transition:opacity .2s;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.card-btn:hover .scrub{opacity:1}
.scrub .line{flex:1;height:2px;background:rgba(255,255,255,.25);position:relative}
.scrub .line i{position:absolute;left:0;top:0;bottom:0;background:var(--rec);width:0}
.scrub .mono{color:#fff;font-size:.62rem;font-variant-numeric:tabular-nums}
.card-meta{display:grid;grid-template-columns:1fr auto;gap:2px 12px;margin-top:14px}
.card-meta h3{font-family:var(--f-display);font-size:1.9rem;text-transform:uppercase;line-height:1;font-weight:800;transition:color .2s}
.card-btn:hover h3{color:var(--tungsten)}
.card-meta .yr{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);align-self:center;font-variant-numeric:tabular-nums}
.card-meta .mono{color:var(--muted)}
.card-meta .ratio{color:var(--tungsten);justify-self:end}
.hint{margin:-20px 0 28px}

.list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.2fr) minmax(0,1fr) 70px 70px;gap:16px;align-items:center;width:100%;text-align:left;padding:18px 0;border-bottom:1px solid var(--line);transition:padding .25s}
.row .t{font-family:var(--f-display);font-size:clamp(1.6rem,3.2vw,2.6rem);text-transform:uppercase;font-weight:800;line-height:1;transition:color .2s}
.row .mono{color:var(--muted)}
.row:hover{padding-left:14px}
.row:hover .t{color:var(--tungsten)}
.row:hover .mono{color:var(--paper)}
@media (max-width:700px){.row{grid-template-columns:1fr auto}.row .c3,.row .c4,.row .c5{display:none}}
.preview{position:fixed;left:0;top:0;width:340px;z-index:40;pointer-events:none;opacity:0;transition:opacity .2s;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.preview.on{opacity:1}
@media (hover:none){.preview{display:none}}
.empty{padding:48px 0;color:var(--muted)}

/* fotografies */
.photos{columns:3 280px;column-gap:20px}
.photo{break-inside:avoid;margin:0 0 20px}
.photo button{display:block;width:100%;text-align:left}
.photo .pf{transition:transform .4s}
.photo button:hover .pf{transform:scale(.985)}
.photo.analog .pf{background:#050505;padding:14px 10px 30px;position:relative}
.photo.analog .pf::after{content:attr(data-edge);position:absolute;left:12px;bottom:9px;font-family:var(--f-mono);font-size:.58rem;letter-spacing:.2em;color:#d98a3a;white-space:nowrap;overflow:hidden;right:12px}
.photo figcaption{display:flex;justify-content:space-between;gap:12px;margin-top:8px}

/* BTS */
.bts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:20px}
.bts figure{margin:0}
.bts .frame{aspect-ratio:4/5;filter:grayscale(1) contrast(1.15) brightness(.9);transition:filter .6s ease}
.bts figure:nth-child(3n+2) .frame{aspect-ratio:3/2}
.bts figure:hover .frame{filter:none}
@media (hover:none){.bts .frame{filter:none}}
.bts figcaption{margin-top:8px;font-size:.88rem;color:var(--muted)}
.bts figcaption b{color:var(--paper);font-weight:600}

/* sobre mi */
.about{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,5vw,80px)}
.about .portrait .frame{aspect-ratio:3/4}
.about-body{display:flex;flex-direction:column;gap:44px;min-width:0}
.about-body .lede{max-width:34ch}
.block h3{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tungsten);font-weight:500;margin-bottom:14px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.roles button{background:var(--ink);padding:18px;text-align:left;transition:background .2s}
.roles button:hover{background:var(--ink-2)}
.roles b{display:block;font-family:var(--f-display);font-size:1.5rem;text-transform:uppercase;font-weight:800;line-height:1.1}
.roles span{display:block;font-size:.92rem;color:var(--muted)}
.roles em{display:block;margin-top:10px;font-style:normal;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tungsten)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:10px 28px;margin:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.cv{width:100%;border-collapse:collapse;font-size:.95rem}
.cv td{padding:10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.cv td:first-child{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);width:70px;padding-top:13px}
.cv td:last-child{text-align:right;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;color:var(--tungsten);padding-top:13px}
.cv button{text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.cv button:hover{text-decoration-color:var(--tungsten)}
@media (max-width:820px){.about{grid-template-columns:1fr}.about .portrait{max-width:360px}}

/* contacte */
.contact-mail{display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;margin-block:12px 40px}
.contact-mail a{font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,6.4vw,5.4rem);text-transform:uppercase;line-height:1;text-decoration:none;overflow-wrap:anywhere;user-select:all}
.contact-mail a:hover{color:var(--tungsten)}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));border-top:1px solid var(--line)}
.links a{display:flex;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--line);text-decoration:none;margin-right:24px;transition:color .2s,padding .2s}
.links a:hover{color:var(--tungsten);padding-left:8px}
footer{padding-block:28px;border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;color:var(--muted)}
footer button:hover{color:var(--paper)}

/* fitxa de projecte */
.sheet{position:fixed;inset:0;z-index:100;background:var(--ink);overflow-y:auto;overscroll-behavior:contain;animation:sheetIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetIn{from{clip-path:inset(50% 0 50% 0)}to{clip-path:inset(0 0 0 0)}}
.sheet-bar{position:sticky;top:0;z-index:5;background:rgba(14,13,12,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sheet-bar .wrap{display:flex;justify-content:space-between;align-items:center;height:var(--head);gap:16px}
.sheet-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 32px;padding-block:28px 20px}
.sheet-title{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:clamp(3rem,10vw,8.5rem);line-height:.85}
.sheet-hero .screen{aspect-ratio:2.39/1}
@media (max-width:700px){.sheet-hero .screen{aspect-ratio:16/10}}
.sheet-hero .frame{position:absolute;inset:0;height:100%}
.sheet-info{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(28px,5vw,72px);padding-block:36px 64px}
.sheet-info .lede{max-width:28ch}
.spec{display:grid;grid-template-columns:auto 1fr;margin:0;border-top:1px solid var(--line)}
.spec dt,.spec dd{padding:11px 0;border-bottom:1px solid var(--line);margin:0}
.spec dt{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-right:24px;padding-top:14px}
.spec dd{text-align:right}
.reel{margin-top:32px}
.reel .frame{position:absolute;inset:0;height:100%;filter:brightness(.55)}
.play{position:absolute;z-index:3;display:flex;align-items:center;gap:14px;text-decoration:none}
.play i{width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.7);display:grid;place-items:center;transition:background .2s,transform .2s}
.play i::before{content:"";border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.play:hover i{background:var(--rec);border-color:var(--rec);transform:scale(1.08)}
.sub-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:20px;border-top:1px solid var(--line);margin-top:24px}
.sub-head h3{font-family:var(--f-display);font-size:clamp(1.8rem,4vw,3rem);text-transform:uppercase}
.stills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.stills figure{margin:0}
.stills figure:first-child{grid-column:1/-1}
.stills button{display:block;width:100%}
.stills figcaption{margin-top:6px}
@media (max-width:700px){.stills{grid-template-columns:1fr}.sheet-info{grid-template-columns:1fr}}
.mk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.mk .frame{aspect-ratio:4/5;filter:grayscale(1) contrast(1.15);transition:filter .5s}
.mk figure{margin:0}
.mk figure:hover .frame{filter:none}
@media (max-width:820px){.mk{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (hover:none){.mk .frame{filter:none}}
.next{display:block;width:100%;text-align:left;margin-top:64px;padding-block:40px 64px;border-top:1px solid var(--line)}
.next b{display:block;font-family:var(--f-display);font-size:clamp(2.4rem,8vw,6rem);text-transform:uppercase;line-height:.9;transition:color .2s,transform .3s}
.next:hover b{color:var(--tungsten);transform:translateX(12px)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:150;background:rgba(6,6,5,.96);display:grid;place-items:center;padding:max(60px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(60px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb figure{margin:0;max-width:100%}
.lb figcaption{display:flex;justify-content:space-between;gap:16px;margin-top:10px}
.lb-btn{position:absolute;padding:10px 14px;border:1px solid var(--line);font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase}
.lb-btn:hover{background:var(--paper);color:var(--ink)}
.lb-close{top:max(14px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
.lb-prev{left:max(16px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px))}
.lb-next{right:max(16px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px))}

/* cursor-visor */
.reticle{position:fixed;left:0;top:0;z-index:180;width:76px;height:50px;margin:-25px 0 0 -38px;pointer-events:none;opacity:0;transition:opacity .2s, width .25s, height .25s, margin .25s}
.reticle.on{opacity:1}
.reticle.big{width:96px;height:64px;margin:-32px 0 0 -48px}
.reticle i{position:absolute;width:12px;height:12px;border:0 solid #fff}
.reticle .a{top:0;left:0;border-width:1.5px 0 0 1.5px}.reticle .b{top:0;right:0;border-width:1.5px 1.5px 0 0}
.reticle .c{bottom:0;left:0;border-width:0 0 1.5px 1.5px}.reticle .d{bottom:0;right:0;border-width:0 1.5px 1.5px 0}
.reticle::before,.reticle::after{content:"";position:absolute;left:50%;top:50%;background:#fff}
.reticle::before{width:1px;height:10px;transform:translate(-50%,-50%)}
.reticle::after{width:10px;height:1px;transform:translate(-50%,-50%)}
.reticle span{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:#fff;display:flex;align-items:center;gap:6px;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.reticle span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--rec)}
@media (hover:hover) and (pointer:fine){[data-cursor]{cursor:none}}
@media not ((hover:hover) and (pointer:fine)){.reticle{display:none}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* ============ fotogrames generats (placeholders) ============ */
function hash(s){let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%2147483646+1}
function rng(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647}
function grade(pal, seed){
  const r=rng(seed); const [sh,md,hl,ac]=pal; const n=v=>v.toFixed(0);
  const layers=[
    `radial-gradient(ellipse ${n(18+r()*22)}% ${n(22+r()*30)}% at ${n(12+r()*76)}% ${n(15+r()*50)}%, ${hl} 0%, ${hl}00 70%)`,
    `radial-gradient(circle at ${n(r()*100)}% ${n(r()*100)}%, ${ac}cc 0%, ${ac}00 32%)`];
  if(r()>.35){const x=+n(r()*80), w=+n(6+r()*16);
    layers.push(`linear-gradient(90deg, transparent ${x}%, ${sh}e6 ${x}%, ${sh}e6 ${x+w}%, transparent ${x+w}%)`);}
  if(r()>.5){const y=n(55+r()*30); layers.push(`linear-gradient(180deg, transparent ${y}%, ${sh}d9 ${y}%)`);}
  layers.push(`radial-gradient(ellipse ${n(50+r()*40)}% ${n(50+r()*40)}% at ${n(r()*100)}% ${n(40+r()*60)}%, ${md} 0%, ${md}00 75%)`);
  layers.push(`linear-gradient(${n(r()*360)}deg, ${sh} 0%, ${md}66 100%)`);
  return "background:"+layers.join(",")+";";
}
const pad=v=>String(v).padStart(2,"0");
function tcFrom(seed){const r=rng(seed);return `01:${pad(Math.floor(r()*40))}:${pad(Math.floor(r()*60))}:${pad(Math.floor(r()*25))}`}
function frame(pal, seed, opts={}){
  const {ar, img, tag, cls=""}=opts;
  const fit = ar ? `aspect-ratio:${ar};` : "";
  const tall = ar && ar < 16/9 ? " tall" : "";
  return `<div class="frame${tall} ${cls}" style="${fit}${img?"":grade(pal,seed)}">${img?`<img src="${img}" alt="" loading="lazy">`:""}${tag?`<span class="tag">${tag}</span>`:""}</div>`;
}

  tabsEl.innerHTML=featured.map((p,i)=>`<button class="mono${i===heroI?" on":""}${i<heroI?" done":""}" data-slide="${i}"><span class="bar"><i></i></span><span class="tt"><span class="tn">${pad(i+1)} · </span>${esc(p.title)}</span></button>`).join("");

function setCap(){const p=featured[heroI];document.getElementById("heroCap").textContent=`${p.title} — ${typeName(p.type)} · ${rolesTxt(p)}`;document.getElementById("heroRatio").textContent=p.ratio;
  document.getElementById("heroScreen").setAttribute("aria-label",`${t("open")} ${p.title}`)}
function goSlide(i){
  const s=slidesEl.children; s[heroI].classList.remove("on"); heroI=(i+featured.length)%featured.length; s[heroI].classList.add("on");
  setCap(); renderTabs(); clearTimeout(heroTimer); if(!reduce) heroTimer=setTimeout(()=>goSlide(heroI+1),HERO_MS);
}

/* timecode a 25 fps */
const tcEl=document.getElementById("tc"); const t0=performance.now(); let lastF=-1;
function tick(now){const f=Math.floor((now-t0)/40); if(f!==lastF){lastF=f;
  tcEl.textContent=`${pad(1+Math.floor(f/90000))}:${pad(Math.floor(f/1500)%60)}:${pad(Math.floor(f/25)%60)}:${pad(f%25)}`}
  requestAnimationFrame(tick)}

const grid=document.getElementById("grid"), list=document.getElementById("list"), empty=document.getElementById("empty");
const SCRUB_N=5;
function renderWork(){
  const items=PROJECTS.filter(p=>(state.type==="all"||p.type===state.type)&&(state.role==="all"||p.roles.includes(state.role)));
  document.getElementById("count").textContent=pad(items.length);
  empty.hidden=items.length>0;
  grid.hidden=state.view!=="grid"; list.hidden=state.view!=="list"; document.getElementById("hint").hidden=state.view!=="grid";
  grid.innerHTML=items.map((p,i)=>{
    const tall=p.ar<16/9?" tall":"";
    const frames=Array.from({length:SCRUB_N},(_,k)=>frame(p.pal,stillSeed(p,k),{img:stillImg(p,k),cls:k?"":"on"})).join("");
    return `<article class="card" style="animation-delay:${i*50}ms"><button class="card-btn" data-open="${p.id}" data-cursor="view" aria-label="${t("open")} ${esc(p.title)}">
      <div class="screen"><div class="stack${tall}" style="aspect-ratio:${p.ar}">${frames}</div>
        <div class="scrub" aria-hidden="true"><span class="line"><i></i></span><span class="mono">${tcFrom(hash(p.id+"tc0"))}</span></div></div>
      <div class="card-meta"><h3>${esc(p.title)}</h3><span class="yr">${p.year}</span>
        <span class="mono">${typeName(p.type)} · ${rolesTxt(p)}</span><span class="mono ratio">${p.ratio}</span></div></button></article>`}).join("");
  list.innerHTML=items.map(p=>`
    <button class="row" data-open="${p.id}" data-prev="${p.id}">
      <span class="t">${esc(p.title)}</span><span class="mono c2">${typeName(p.type)}</span>
      <span class="mono c3">${rolesTxt(p)}</span><span class="mono c4">${p.ratio}</span><span class="mono c5">${p.year}</span>
    </button>`).join("");
}
/* scrub: recórrer els frames movent el cursor */
grid.addEventListener("mousemove",e=>{
  const btn=e.target.closest(".card-btn"); if(!btn) return;
  const sc=btn.querySelector(".screen"), r=sc.getBoundingClientRect();
  const x=Math.min(.999,Math.max(0,(e.clientX-r.left)/r.width)); const k=Math.floor(x*SCRUB_N);
  const fr=btn.querySelectorAll(".stack .frame"); fr.forEach((f,i)=>f.classList.toggle("on",i===k));
  btn.querySelector(".scrub .line i").style.width=(x*100).toFixed(1)+"%";
  const p=byId(btn.dataset.open); btn.querySelector(".scrub .mono").textContent=tcFrom(hash(p.id+"tc"+k));
});
grid.addEventListener("mouseout",e=>{
  const btn=e.target.closest(".card-btn"); if(!btn||btn.contains(e.relatedTarget)) return;
  btn.querySelectorAll(".stack .frame").forEach((f,i)=>f.classList.toggle("on",i===0));
});

function openProject(id){
  const p=byId(id); if(!p) return; currentId=id;
  const i=PROJECTS.indexOf(p), next=PROJECTS[(i+1)%PROJECTS.length];
  const stills=Array.from({length:5},(_,k)=>`<figure><button data-still="${k+1}" data-cursor="zoom" aria-label="Still ${k+1}">${frame(p.pal,stillSeed(p,k+1),{ar:p.ar,img:stillImg(p,k+1),tag:"STILL "+pad(k+1)})}</button>
      <figcaption class="mono muted">TC ${tcFrom(hash(p.id+"tc"+(k+1)))}</figcaption></figure>`).join("");
  const mk=Array.from({length:4},(_,k)=>`<figure data-cursor="color">${frame(p.pal,hash(p.id+"mk"+k),{img:p.bts&&p.bts[k]})}</figure>`).join("");
  sheet.innerHTML=`
    <div class="sheet-bar"><div class="wrap">
      <span class="mono muted">${pad(i+1)} / ${pad(PROJECTS.length)} · ${typeName(p.type)}</span>
      <button class="btn" id="closeSheet">${t("sheet.close")}</button>
    </div></div>
    <div class="wrap">
      <div class="sheet-head"><h2 class="sheet-title" id="sheetTitle">${esc(p.title)}</h2>
        <p class="mono muted">${esc(L(p.length))} · ${p.year} · ${p.ratio}</p></div>
      <div class="sheet-hero"><div class="screen corners">${frame(p.pal,stillSeed(p,0),{img:stillImg(p,0)})}</div></div>
      <div class="sheet-info">
        <div>
          <p class="lede">${esc(L(p.log))}</p>
          <div class="reel"><div class="screen">${frame(p.pal,hash(p.id+"reel"))}
            <a class="play mono" href="${p.vimeo||"https://vimeo.com/"}" target="_blank" rel="noopener"><i aria-hidden="true"></i>${t("sheet.trailer")}</a></div></div>
        </div>
        <dl class="spec">
          <dt>${t("spec.role")}</dt><dd>${rolesTxt(p)}</dd>
          <dt>${t("spec.dir")}</dt><dd>${esc(p.director)}</dd>
          <dt>${t("spec.prod")}</dt><dd>${esc(p.prod)}</dd>
          <dt>${t("spec.cam")}</dt><dd>${esc(p.camera)}</dd>
          <dt>${t("spec.lens")}</dt><dd>${esc(p.lenses)}</dd>
          <dt>${t("spec.format")}</dt><dd>${esc(p.format)}</dd>
          <dt>${t("spec.ratio")}</dt><dd>${p.ratio}</dd>
        </dl>
      </div>
      <div class="sub-head"><h3>${t("sheet.frames")}</h3><span class="mono muted">${p.ratio}</span></div>
      <div class="stills">${stills}</div>
      <div class="sub-head"><h3>${t("sheet.mk")}</h3><span class="mono muted">${t("sheet.onset")}</span></div>
      <div class="mk">${mk}</div>
      <button class="next" data-next="${next.id}"><span class="mono muted">${t("sheet.next")}</span><b>${esc(next.title)} →</b></button>
    </div>`;
  if(sheet.hidden){lastFocus=document.activeElement; sheet.hidden=false; document.documentElement.style.overflow="hidden";}
  else { sheet.style.animation="none"; void sheet.offsetWidth; sheet.style.animation=""; }
  sheet.scrollTop=0; preview.classList.remove("on"); hideReticle();
  document.getElementById("closeSheet").focus();
}
function closeSheet(){sheet.hidden=true;currentId=null;document.documentElement.style.overflow="";hideReticle();if(lastFocus)lastFocus.focus()}
sheet.addEventListener("click",e=>{
  if(e.target.closest("#closeSheet")) return closeSheet();
  const n=e.target.closest("[data-next]"); if(n){e.stopPropagation(); openProject(n.dataset.next); return;}
  const s=e.target.closest("[data-still]"); if(s){const p=byId(currentId);
    openLb(Array.from({length:5},(_,k)=>({pal:p.pal,seed:stillSeed(p,k+1),ar:p.ar,img:stillImg(p,k+1),title:`${p.title} · Still ${pad(k+1)}`,meta:"TC "+tcFrom(hash(p.id+"tc"+(k+1)))})),+s.dataset.still-1)}
});

/* ============ LIGHTBOX ============ */
const lb=document.getElementById("lb"); let lbItems=[], lbI=0, lbFocus=null;
function drawLb(){
  const it=lbItems[lbI]; const ar=it.ar||1.5;
  const w=`min(100%, calc((100vh - 170px) * ${ar}))`;
  lb.innerHTML=`<button class="lb-btn lb-close" data-lb="close">${t("lb.close")}</button>
    <figure style="width:${w}">${frame(it.pal,it.seed,{ar,img:it.img})}
    <figcaption><span>${esc(it.title)}</span><span class="mono muted">${pad(lbI+1)} / ${pad(lbItems.length)} · ${esc(it.meta)}</span></figcaption></figure>
    ${lbItems.length>1?`<button class="lb-btn lb-prev" data-lb="prev">${t("lb.prev")}</button><button class="lb-btn lb-next" data-lb="next">${t("lb.next")}</button>`:""}`;
}
function openLb(items,i){lbItems=items;lbI=i;lbFocus=document.activeElement;lb.hidden=false;document.documentElement.style.overflow="hidden";drawLb();hideReticle();lb.querySelector(".lb-close").focus()}
function closeLb(){lb.hidden=true;if(sheet.hidden)document.documentElement.style.overflow="";if(lbFocus)lbFocus.focus()}
lb.addEventListener("click",e=>{const b=e.target.closest("[data-lb]");
  if(!b){ if(e.target===lb) closeLb(); return; }
  if(b.dataset.lb==="close") closeLb();
  else { lbI=(lbI+(b.dataset.lb==="next"?1:-1)+lbItems.length)%lbItems.length; drawLb(); lb.querySelector(`[data-lb="${b.dataset.lb}"]`).focus(); }
});
document.addEventListener("keydown",e=>{
  if(!lb.hidden){ if(e.key==="Escape")closeLb(); if(e.key==="ArrowRight"){lbI=(lbI+1)%lbItems.length;drawLb()} if(e.key==="ArrowLeft"){lbI=(lbI-1+lbItems.length)%lbItems.length;drawLb()} return; }
  if(!sheet.hidden && e.key==="Escape") closeSheet();
  if(introRunning && e.key==="Escape") endIntro();
});

/* ============ CURSOR-VISOR ============ */
const ret=document.getElementById("reticle"), retL=document.getElementById("reticleLabel");
const fine=matchMedia("(hover:hover) and (pointer:fine)").matches;
let mx=0,my=0,rx=0,ry=0,retOn=false;
function hideReticle(){ret.classList.remove("on");retOn=false}
if(fine){
  document.addEventListener("mousemove",e=>{mx=e.clientX;my=e.clientY;
    const el=e.target.closest("[data-cursor]");
    if(el){const k=el.dataset.cursor; retL.textContent=t("cur."+k); ret.classList.add("on"); ret.classList.toggle("big",k==="view"); if(!retOn){rx=mx;ry=my;retOn=true}}
    else hideReticle();
  });
  document.addEventListener("mouseleave",hideReticle);
  (function loop(){ rx+=(mx-rx)*.22; ry+=(my-ry)*.22; ret.style.transform=`translate(${rx.toFixed(1)}px,${ry.toFixed(1)}px)`; requestAnimationFrame(loop) })();
}

/* ============ progrés de lectura i secció activa ============ */
const prog=document.getElementById("progress"), navLinks=[...document.querySelectorAll(".nav a")];
function onScroll(){
  const h=document.documentElement.scrollHeight-innerHeight; prog.style.transform=`scaleX(${h>0?(scrollY/h).toFixed(4):0})`;
  let cur=null; for(const a of navLinks){const s=document.querySelector(a.getAttribute("href")); if(s && s.getBoundingClientRect().top<innerHeight*.4) cur=a;}
  navLinks.forEach(a=>a.classList.toggle("cur",a===cur));
}
addEventListener("scroll",onScroll,{passive:true}); onScroll();

/* ============ menú, correu, idioma ============ */
const menuBtn=document.getElementById("menuBtn"), nav=document.getElementById("nav");
menuBtn.addEventListener("click",()=>{const o=nav.classList.toggle("open");menuBtn.setAttribute("aria-expanded",o);menuBtn.textContent=o?t("menu.close"):t("menu")});
nav.addEventListener("click",e=>{if(e.target.closest("a")){nav.classList.remove("open");menuBtn.setAttribute("aria-expanded","false");menuBtn.textContent=t("menu")}});
document.getElementById("copyMail").addEventListener("click",e=>{
  const b=e.currentTarget, mail=document.getElementById("mail").textContent;
  const done=()=>{b.textContent=t("contact.copied");setTimeout(()=>b.textContent=t("contact.copy"),1800)};
  const fallback=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("mail"));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent=t("contact.selected")};
  try{navigator.clipboard.writeText(mail).then(done,fallback)}catch(_){fallback()}
});
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el=>el.innerHTML=t(el.dataset.i18nHtml));
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  menuBtn.textContent=nav.classList.contains("open")?t("menu.close"):t("menu");
  renderFilters(); renderWork(); renderPhotos(); renderBts(); renderAbout(); renderTabs(); setCap();
  if(!sheet.hidden && currentId) openProject(currentId);
  if(!lb.hidden) drawLb();
}
document.querySelector(".lang").addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b)return;
  lang=b.dataset.lang; try{localStorage.setItem("bva-lang",lang)}catch(_){} applyLang()});

/* ============ INTRO (dins la portada) ============ */
const heroEl=document.getElementById("heroScreen"), vfT=document.getElementById("vfT"), vfF=document.getElementById("vfF");
let introTimers=[], introRunning=false;
function endIntro(){
  introTimers.forEach(clearTimeout); introTimers=[]; introRunning=false;
  heroEl.classList.remove("flying","land"); ["top","left","width","height"].forEach(p=>heroEl.style[p]="");
  document.body.classList.remove("intro-on","settle");
  document.documentElement.style.overflow=(sheet.hidden&&lb.hidden)?"":"hidden";
  document.body.classList.add("go"); startHero();
}
function playIntro(){
  if(reduce){ endIntro(); return; }
  introTimers.forEach(clearTimeout); introTimers=[]; introRunning=true; stopHero();
  scrollTo({top:0,behavior:"instant"}); document.documentElement.style.overflow="hidden";
  document.body.classList.remove("go","settle"); document.body.classList.add("intro-on");
  slidesEl.style.animation="none"; void slidesEl.offsetWidth; slidesEl.style.animation="";
  heroEl.classList.remove("land"); heroEl.classList.add("flying");
  Object.assign(heroEl.style,{top:"0px",left:"0px",width:innerWidth+"px",height:innerHeight+"px"});
  ["T22","T16","T11","T8","T5.6","T4","T2.8","T2.0"].forEach((v,i)=>introTimers.push(setTimeout(()=>vfT.textContent=v,110*i)));
  ["∞","12 m","6 m","3.5 m","2.6 m","2.0 m","2.2 m","2.1 m"].forEach((v,i)=>introTimers.push(setTimeout(()=>vfF.textContent=v,180*i+120)));
  introTimers.push(setTimeout(()=>{
    const r=document.getElementById("heroSlot").getBoundingClientRect();
    document.body.classList.add("settle"); heroEl.classList.add("land");
    Object.assign(heroEl.style,{top:r.top+"px",left:r.left+"px",width:r.width+"px",height:r.height+"px"});
  },1950));
  introTimers.push(setTimeout(endIntro,2980));
}
document.getElementById("skipIntro").addEventListener("click",e=>{e.stopPropagation();endIntro()});
addEventListener("resize",()=>{if(introRunning)endIntro()});

document.getElementById("replay").addEventListener("click",()=>playIntro());

/* ============ arrencada ============ */
applyLang();
playIntro();
</script>

</body>
</html>
